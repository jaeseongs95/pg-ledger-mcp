# 검증 실패 이유의 한국어 패턴 (java.text.MessageFormat). ValidationReason마다 reason.<NAME> 키 하나.
# {0}, {1} ...은 ValidationIssue의 이유 인자이며, 작은따옴표는 두 번 쓴다. 문장은 "<경로>: <이유>"로 경로 뒤에 붙는다.
reason.REQUIRED=필수입니다
reason.REQUIRED_WHEN_SET={0}을(를) 지정하면 필수입니다
reason.REQUIRED_WITH_SCOPE=범위를 지정하면 필수입니다
reason.REQUIRED_TO_EDIT=수정하려면 필수입니다
reason.REQUIRED_FOR_CONDITION=조건에는 필수입니다
reason.REQUIRED_FOR_IMPORTED_OPERATIONS=가져온 작업에는 필수입니다
reason.MUST_BE_AT_MOST_CHARS={0}자 이하여야 합니다
reason.MUST_BE_CHARS_RANGE={0}~{1}자여야 합니다
reason.LEGACY_ACTOR_ID_LENGTH=이전 행위자 ID는 {0}~{1}자여야 합니다
reason.MUST_HOLD_ITEMS={0}~{1}개가 있어야 합니다
reason.UNKNOWN_VALUE=알 수 없는 값입니다: {0}
reason.NOT_A_VALID_POSITION=올바른 위치가 아닙니다
reason.CURSOR_DAMAGED=손상되었습니다
reason.CURSOR_OTHER_LIST=다른 목록의 것입니다
reason.CURSOR_OTHER_FILTERS=다른 조건으로 만든 것입니다
reason.NOT_AN_INTEGER=정수여야 합니다
reason.OUT_OF_RANGE={0}~{1} 범위여야 합니다
reason.NOT_ACTIVE_CODE=활성 코드가 아닙니다
reason.INVALID_JSON=도구 입력으로 읽을 수 없는 JSON입니다
reason.UNKNOWN_ARGUMENT=알려진 인자가 아닙니다
reason.WRONG_TYPE={0} 형식이어야 합니다
reason.MUST_BE_EXACTLY_ONE_OF={0} 또는 {1} 중 정확히 하나여야 합니다
reason.SET_EXACTLY_WHEN_STATUS_IS=상태가 {0}일 때만 지정합니다
reason.SET_EXACTLY_FOR={0}일 때만 지정합니다
reason.MUST_NOT_BE_THE_DEFECT_ITSELF=결함 자신일 수 없습니다
reason.MUST_DIFFER_FROM={0}과(와) 달라야 합니다
reason.MUST_MENTION_A_FIELD=필드가 하나 이상 있어야 합니다
reason.EXISTS_ONLY_FOR={0}에만 있습니다
reason.NATIVE_ENTRY_NEEDS_DECLARED_AUTHOR=직접 기록한 항목에는 선언된 작성자가 있어야 합니다
reason.VERIFICATION_NEEDS_REVIEWER_CHANNEL=검증에는 검토자 채널이 필요합니다
reason.MUST_BE_AFTER_GRANT_TIME=부여 시각보다 뒤여야 합니다
reason.HAS_NO_STATE=상태가 없습니다: {0}
reason.MUST_MATCH={0} 형식이어야 합니다
reason.MUST_BE_LOWER_CASE_HEX=소문자 16진수 {0}자여야 합니다
reason.DEFECT_ID_FORMAT=<PROJECT_CODE>-D-<4자리 이상의 숫자> 형식이어야 합니다
reason.MUST_BE_POSITIVE=양수여야 합니다
reason.MUST_BE_UPPER_CASE_ID_MATCHING={0} 형식의 대문자 ID여야 합니다
reason.MUST_NOT_BE_BLANK=비어 있으면 안 됩니다
reason.MUST_BE_UUID=UUID여야 합니다
reason.MUST_BE_ISO_8601_INSTANT=Z 또는 오프셋이 있는 ISO-8601 시각이어야 합니다
reason.MUST_NAME_A_SCOPE=범위가 하나 이상 있어야 합니다
reason.CANNOT_BE_SAVED=저장할 수 없습니다: {0}
reason.NOT_AN_EDITABLE_FIELD_OF={0}의 수정 가능한 필드가 아닙니다(상태 변경은 transition을 쓰세요)
reason.MUST_NOT_BE_NEGATIVE=음수일 수 없습니다
reason.MUST_START_WITH={0}(으)로 시작해야 합니다
reason.MUST_BE_ED25519_PUBLIC_KEY=Ed25519 공개 키(base64로 쓴 X.509 DER)여야 합니다. 훅 명령 session-key가 출력하는 값입니다
reason.MUST_BE_A_SESSION_AUTHOR=세션의 작성자(<vendor>:<session-id>)여야 합니다. 소유자 역할 user:owner는 서명하지 않으므로 키를 등록하지 않습니다
reason.MUST_BE_SESSION_KEY_BLOCK=공개 키만 있거나, 훅 명령 session-key가 출력하는 네 줄(server, author, public-key, fingerprint) 그대로여야 합니다
reason.KEY_BLOCK_FINGERPRINT_DIFFERS=붙여넣은 블록의 fingerprint 줄이 그 공개 키의 지문이 아닙니다. 블록이 바뀌었으니 세션에서 다시 복사하세요
reason.KEY_BLOCK_AUTHOR_DIFFERS=붙여넣은 블록은 작성자 {0}의 것이며 입력한 작성자가 아닙니다
reason.MERGE_CHAIN_LOOPS=병합 대상을 따라가면 자기 자신으로 돌아오는 순환 병합입니다
