# English message patterns (java.text.MessageFormat). One key per error code: error.<TOKEN>.
error.HOST_ATTESTATION_REQUIRED=The host hook did not attach the session (the pg-ledger-mcp client hook must be installed).
error.AUTHOR_ID_FORMAT=author_id must be <vendor>:<session-id> (vendor lower case, for example claude:1234abcd) or user:owner (got {0}).
error.SESSION_NOT_GRANTED={0} has no live {1} grant on project {2}.
error.VERIFY_NEEDS_REVIEWER_LOGIN=Verification is recorded only through the reviewer channel.
error.VALIDATION_FAILED={0}: {1}
error.REASON_INVALID=reason must be 10..1000 characters.
error.CODE_REQUIRED={0} is required, one of: {1} (group {2}).
error.CODE_INVALID={0} = {1} is not an active code of {2}, use one of: {3}.
error.ID_PREFIX_MISMATCH=Defect id {0} must start with {1}.
error.TRANSITION_INVALID=Transition {0} to {1} is not allowed.
error.FIX_REQUIRED={0} needs a recorded fix commit.
error.FIX_ALREADY_RECORDED=The fix is already recorded; pass CI data to update it.
error.EVIDENCE_REQUIRED=Moving to {0} needs evidence_uri.
error.MERGE_TARGET_INVALID=MERGED needs a live merge target.
error.MERGED_DEFECT={0} was merged into {1}; record the case on {1}.
error.SAME_SESSION=The reviewing session must differ from the session that recorded the fix or reported the work.
error.PROJECT_MOVE_FORBIDDEN=A defect cannot move to another project (its id carries the project code).
error.NOTHING_CHANGES=Nothing changes.
error.VERSION_CONFLICT=Version conflict on {0} {1}: expected {2}, current {3}.
error.REQUEST_CONFLICT=Request {0} is already bound to another operation, payload, author or channel.
error.REQUEST_ID_LEGACY=Request id {0} belongs to an imported receipt; use a new request id.
error.DUPLICATE_KEY={0} already exists.
error.NOT_FOUND={0} {1} not found.
error.AGENT_TOKEN_FORBIDDEN=The agent token cannot be used on the admin interface.
error.UNAUTHORIZED=Authentication is required.
error.DNS_REBINDING_BLOCKED=The Host header is not allowed.
error.TOO_MANY_AUTH_FAILURES=Too many failed attempts; try again later.
error.COMMON_CODE_DELETE_FORBIDDEN=Common codes are never deleted or renamed; set the state to INACTIVE instead.
error.PAYLOAD_TOO_LARGE=The request body is too large.
error.CSRF_REJECTED=The CSRF token is missing or invalid.
error.DRIVER_NOT_CONFIGURED=No JDBC driver is registered; register one with the driver-register command.
error.DRIVER_INVALID=The JDBC driver is not usable: {0}.
error.INTERNAL_ERROR=An internal error occurred.
error.INTEGRITY_VIOLATION=The change violates a data integrity rule.
