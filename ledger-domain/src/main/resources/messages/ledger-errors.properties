# English message patterns (java.text.MessageFormat). One key per error code: error.<TOKEN>.
error.HOST_ATTESTATION_REQUIRED=The host hook did not attach the session (the pg-ledger-mcp client hook must be installed).
error.AUTHOR_ID_FORMAT=author_id must be <vendor>:<session-id> (vendor lower case, for example claude:1234abcd) or user:owner (got {0}).
error.SESSION_NOT_GRANTED={0} has no live {1} grant on project {2}.
error.VERIFY_NEEDS_REVIEWER_LOGIN=Verification is recorded only through the reviewer channel.
error.ATTESTATION_UNSIGNED=The host attestation is not signed (an old hook sends only <vendor>:<session-id>); update the pg-ledger-mcp client hook.
error.ATTESTATION_MALFORMED=The host attestation is not a valid signed attestation.
error.ATTESTATION_VERSION_UNSUPPORTED=The host attestation has the retired format pgla1, which is no longer accepted; update the pg-ledger-mcp client hook.
error.ATTESTATION_SIGNATURE_INVALID=The host attestation cannot be verified: its signature does not match a session key registered on this server, or this author has no session key registered on this server. If the key is new, show the public key and fingerprint printed by the hook command session-key <server name> <author> to the owner and have the owner register it on this server.
error.ATTESTATION_BINDING_MISMATCH=The host attestation was signed for another {0} than the one of this call (tool = the called tool, request_id = the request id, arguments = the whole arguments of the call).
error.ATTESTATION_TIME_WINDOW=The host attestation was issued more than {0} seconds away from the server time; check the clock of the machine that runs the hook.
# {0} is the path (the only argument of the exception); {1} is the sentence of the first issue, resolved by the caller from reason.<NAME> of ledger-reasons.
error.VALIDATION_FAILED={0}: {1}
error.REASON_INVALID=reason must be 10..1000 characters.
error.CODE_REQUIRED={0} is required, one of: {1} (group {2}).
error.CODE_INVALID={0} = {1} is not an active code of {2}, use one of: {3}.
error.ID_PREFIX_MISMATCH=Defect id {0} must start with {1}.
error.TRANSITION_INVALID=Transition {0} to {1} is not allowed.
error.FIX_REQUIRED={0} needs a recorded fix commit.
error.FIX_ALREADY_RECORDED=The fix is already recorded; pass CI data to update it.
error.EVIDENCE_REQUIRED=Moving to {0} needs evidence_uri.
error.MERGE_TARGET_INVALID=MERGED needs a live merge target.
error.MERGED_DEFECT={0} was merged into {1}; record the case on {1}.
error.SAME_SESSION=The reviewing session must differ from the session that recorded the fix or reported the work.
error.PROJECT_MOVE_FORBIDDEN=A defect cannot move to another project (its id carries the project code).
error.NOTHING_CHANGES=Nothing changes.
error.VERSION_CONFLICT=Version conflict on {0} {1}: expected {2}, current {3}.
error.REQUEST_CONFLICT=Request {0} is already bound to another operation, payload, author or channel.
error.REQUEST_ID_LEGACY=Request id {0} belongs to an imported receipt; use a new request id.
error.DUPLICATE_KEY={0} already exists.
error.KEY_REPLACEMENT_NOT_CONFIRMED=The author {0} already has the registered public key {1} (registered at {2}). Replacing it needs the explicit replace confirmation that names this fingerprint.
error.SESSION_KEY_REQUIRED=The author {0} has no live session key, so no write of this author could be accepted. Register the key first; nothing was granted.
error.NOT_FOUND={0} {1} not found.
error.AGENT_TOKEN_FORBIDDEN=The agent token cannot be used on the admin interface.
error.UNAUTHORIZED=Authentication is required.
error.DNS_REBINDING_BLOCKED=The Host header is not allowed.
error.TOO_MANY_AUTH_FAILURES=Too many failed attempts; try again later.
error.COMMON_CODE_DELETE_FORBIDDEN=Common codes are never deleted or renamed; set the state to INACTIVE instead.
error.PAYLOAD_TOO_LARGE=The request body is too large.
error.CSRF_REJECTED=The CSRF token is missing or invalid.
error.DRIVER_NOT_CONFIGURED=No JDBC driver is registered; register one with the driver-register command.
error.DRIVER_INVALID=The JDBC driver is not usable: {0}.
error.INTERNAL_ERROR=An internal error occurred.
error.INTEGRITY_VIOLATION=The change violates a data integrity rule.
# Schema failures (the migration, the verification, the grants, the time zone of the schema work).
error.SCHEMA_FILE_NAME_INVALID=The schema file name {0} is not valid; expected V<number>__<description>.sql (lower case, number without a leading zero).
error.SCHEMA_VERSION_DUPLICATE=There are two schema files for version {0}.
error.SCHEMA_VERSION_GAP=The schema files have a gap: expected version {0} but found V{1}.
error.SCHEMA_FILES_UNREADABLE=The schema files at {0} cannot be read.
error.SCHEMA_DATABASE_UNREACHABLE=The database cannot be reached for the schema work.
error.SCHEMA_HISTORY_MISSING=The database has no schema history; run the migrate command.
error.SCHEMA_HISTORY_NOT_CREATED=The schema history table cannot be created.
error.SCHEMA_APPLIED_FILE_MISSING=V{0} ({1}) was applied but has no schema file.
error.SCHEMA_DIGEST_MISMATCH=Digest mismatch for V{0} ({1}): applied {2} but the file is {3}.
error.SCHEMA_RECORDED_FAILED=V{0} ({1}) is recorded as FAILED; repair the database, then run the migrate command.
error.SCHEMA_OUT_OF_ORDER=V{0} ({1}) is not applied but V{2} is: schema files must not be added out of order.
error.SCHEMA_PENDING=V{0} ({1}) is pending; run the migrate command.
error.SCHEMA_MIGRATION_FAILED=Migration V{0} ({1}) failed.
error.SCHEMA_MIGRATION_INTERRUPTED=The migration was interrupted while it waited for another migration process.
error.SCHEMA_GRANT_FAILED=The grants cannot be applied to the account (the account must exist and the connection must be allowed to grant).
error.JVM_ZONE_NOT_UTC=The default time zone of the JVM is not UTC; start the JVM with -Duser.timezone=UTC.
error.SESSION_ZONE_NOT_UTC=The time zone of the database session is not UTC (its clock differs from the UTC clock by {0}).
error.SESSION_CLOCK_UNREADABLE=The clock of the database session cannot be read.
