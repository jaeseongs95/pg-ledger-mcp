# English reason patterns (java.text.MessageFormat) of validation failures. One key per ValidationReason:
# reason.<NAME>. The arguments {0}, {1} ... are the reason arguments of the ValidationIssue; a single quote is
# written twice. The sentence follows the path: "<path>: <reason>" (error.VALIDATION_FAILED), for example
# "max_rows: must be 1..1000".
reason.REQUIRED=is required
reason.REQUIRED_WHEN_SET=is required when {0} is set
reason.REQUIRED_WITH_SCOPE=is required when a scope is given
reason.REQUIRED_TO_EDIT=is required to edit
reason.REQUIRED_FOR_CONDITION=is required for a condition
reason.REQUIRED_FOR_IMPORTED_OPERATIONS=is required for imported operations
reason.MUST_BE_AT_MOST_CHARS=must be at most {0} characters
reason.MUST_BE_CHARS_RANGE=must be {0}..{1} characters
reason.LEGACY_ACTOR_ID_LENGTH=legacy actor id must be {0}..{1} characters
reason.MUST_HOLD_ITEMS=must hold {0}..{1} items
reason.UNKNOWN_VALUE=unknown value {0}
reason.NOT_A_VALID_POSITION=is not a valid position
reason.CURSOR_DAMAGED=is damaged
reason.CURSOR_OTHER_LIST=belongs to another list
reason.CURSOR_OTHER_FILTERS=was made for other filters
reason.NOT_AN_INTEGER=must be an integer
reason.OUT_OF_RANGE=must be {0}..{1}
reason.NOT_ACTIVE_CODE=is not an active code
reason.INVALID_JSON=does not fit the input of the tool as JSON
reason.UNKNOWN_ARGUMENT=is not a known argument
reason.WRONG_TYPE=must be of type {0}
reason.MUST_BE_EXACTLY_ONE_OF=must be exactly one of {0} or {1}
reason.SET_EXACTLY_WHEN_STATUS_IS=is set exactly when the status is {0}
reason.SET_EXACTLY_FOR=is set exactly for {0}
reason.MUST_NOT_BE_THE_DEFECT_ITSELF=must not be the defect itself
reason.MUST_DIFFER_FROM=must differ from {0}
reason.MUST_MENTION_A_FIELD=must mention at least one field
reason.EXISTS_ONLY_FOR=exists only for {0}
reason.NATIVE_ENTRY_NEEDS_DECLARED_AUTHOR=a native entry carries a declared author
reason.VERIFICATION_NEEDS_REVIEWER_CHANNEL=a verification needs the reviewer channel
reason.MUST_BE_AFTER_GRANT_TIME=must be after the grant time
reason.HAS_NO_STATE=has no state: {0}
reason.MUST_MATCH=must match {0}
reason.MUST_BE_LOWER_CASE_HEX=must be {0} lower-case hex characters
reason.DEFECT_ID_FORMAT=must match <PROJECT_CODE>-D-<number of 4 or more digits>
reason.MUST_BE_POSITIVE=must be positive
reason.MUST_BE_UPPER_CASE_ID_MATCHING=must be an upper-case id matching {0}
reason.MUST_NOT_BE_BLANK=must not be blank
reason.MUST_BE_UUID=must be a UUID
reason.MUST_BE_ISO_8601_INSTANT=must be an ISO-8601 time with Z or an offset
reason.MUST_NAME_A_SCOPE=must name at least one scope
reason.CANNOT_BE_SAVED=cannot be saved: {0}
reason.NOT_AN_EDITABLE_FIELD_OF=is not an editable field of {0} (state changes use transition)
reason.MUST_NOT_BE_NEGATIVE=must not be negative
reason.MUST_START_WITH=must start with {0}
reason.MUST_BE_ED25519_PUBLIC_KEY=must be an Ed25519 public key (X.509 DER in base64), as printed by the hook command session-key
