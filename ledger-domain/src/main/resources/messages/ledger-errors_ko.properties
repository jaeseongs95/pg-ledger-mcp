# 한국어 메시지 패턴 (java.text.MessageFormat). 오류 코드마다 error.<TOKEN> 키 하나.
error.HOST_ATTESTATION_REQUIRED=호스트 훅이 세션을 넣지 않았습니다(pg-ledger-mcp 클라이언트 훅 설치 필요).
error.AUTHOR_ID_FORMAT=author_id는 <vendor>:<session-id>(vendor는 소문자, 예: claude:1234abcd) 또는 user:owner 형식이어야 합니다(받은 값: {0}).
error.SESSION_NOT_GRANTED={0}에게 프로젝트 {2}의 유효한 {1} 부여가 없습니다.
error.VERIFY_NEEDS_REVIEWER_LOGIN=검증은 검토자 채널로만 기록할 수 있습니다.
error.VALIDATION_FAILED={0}: {1}
error.REASON_INVALID=reason은 10~1000자여야 합니다.
error.CODE_REQUIRED={0}은(는) 필수이며 다음 중 하나여야 합니다: {1} (그룹 {2}).
error.CODE_INVALID={0} = {1}은(는) {2}의 활성 코드가 아닙니다. 다음 중 하나를 쓰세요: {3}.
error.ID_PREFIX_MISMATCH=결함 ID {0}은(는) {1}(으)로 시작해야 합니다.
error.TRANSITION_INVALID={0}에서 {1}(으)로의 전이는 허용되지 않습니다.
error.FIX_REQUIRED={0}에는 기록된 수정 커밋이 필요합니다.
error.FIX_ALREADY_RECORDED=이미 기록된 수정입니다. 갱신하려면 CI 정보를 함께 주세요.
error.EVIDENCE_REQUIRED={0}(으)로 옮기려면 evidence_uri가 필요합니다.
error.MERGE_TARGET_INVALID=MERGED에는 살아 있는 병합 대상이 필요합니다.
error.MERGED_DEFECT={0}은(는) {1}에 병합되었습니다. 사례는 {1}에 기록하세요.
error.SAME_SESSION=검증하는 세션은 수정을 기록했거나 완료를 보고한 세션과 달라야 합니다.
error.PROJECT_MOVE_FORBIDDEN=결함은 다른 프로젝트로 옮길 수 없습니다(ID에 프로젝트 코드가 들어 있습니다).
error.NOTHING_CHANGES=바뀌는 것이 없습니다.
error.VERSION_CONFLICT={0} {1}의 판 충돌: 기대 {2}, 현재 {3}.
error.REQUEST_CONFLICT=요청 {0}은(는) 이미 다른 작업, 내용, 작성자 또는 채널에 묶여 있습니다.
error.REQUEST_ID_LEGACY=요청 ID {0}은(는) 가져온 영수증의 것입니다. 새 요청 ID를 쓰세요.
error.DUPLICATE_KEY={0}이(가) 이미 있습니다.
error.NOT_FOUND={0} {1}을(를) 찾을 수 없습니다.
error.AGENT_TOKEN_FORBIDDEN=에이전트 토큰은 관리 화면에서 쓸 수 없습니다.
error.UNAUTHORIZED=인증이 필요합니다.
error.DNS_REBINDING_BLOCKED=허용되지 않은 Host 헤더입니다.
error.TOO_MANY_AUTH_FAILURES=실패가 너무 많습니다. 잠시 뒤에 다시 시도하세요.
error.COMMON_CODE_DELETE_FORBIDDEN=공통코드는 삭제하거나 이름을 바꿀 수 없습니다. 상태를 INACTIVE로 바꾸세요.
error.PAYLOAD_TOO_LARGE=요청 본문이 너무 큽니다.
error.CSRF_REJECTED=CSRF 토큰이 없거나 올바르지 않습니다.
error.DRIVER_NOT_CONFIGURED=등록된 JDBC 드라이버가 없습니다. driver-register 명령으로 등록하세요.
error.DRIVER_INVALID=JDBC 드라이버를 쓸 수 없습니다: {0}.
error.INTERNAL_ERROR=내부 오류가 발생했습니다.
error.INTEGRITY_VIOLATION=변경이 데이터 무결성 규칙을 어깁니다.
