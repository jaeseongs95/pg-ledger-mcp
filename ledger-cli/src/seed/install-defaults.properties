# The defaults of an installation, the one place they are written. `ledger-cli` reads them from the seed bundle
# (ledger-seed.mv.db, which the build makes from this file and defect-categories.tsv): render-deploy, prepare-host and
# seal-host take them when an option is not given, mcp-check takes the port of the MCP server, and the installers ask for
# them with `ledger-cli install-default <name>`. No secret belongs here: passwords, tokens and keys are secrets of the
# secret store (secret-set, token-generate).
# instance-name: the name of an instance, which gives the services <name> and <name>-admin, the service user and the directories.
instance-name=pg-ledger-mcp
# mcp-port and admin-port: the loopback ports of the MCP server and of the admin web.
mcp-port=8765
admin-port=8865
