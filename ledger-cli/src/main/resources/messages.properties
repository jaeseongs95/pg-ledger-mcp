usage.header=Usage: java -jar ledger-cli.jar <command> [arguments] [--ledger.secrets.directory=<path>]
usage.secret-set=secret-set <name>   Read a secret from the terminal (hidden input) and store it under <name>
secret-set.prompt=Value for secret {0} (input is hidden):
secret-set.stored=Stored secret {0} at {1}
usage.key-register=key-register <author> <public-key> <fingerprint> [--replace=<current-fingerprint>]   Bind the public key a session printed (hook command session-key <server> <author>, the key printed for the server name of this ledger, for example ledger, or codex_apps.<app> for Codex Apps) to its author; the fingerprint is the one the session showed. An author that already has a live key is refused unless --replace names the fingerprint of that key
key-register.registered=Registered the session key {1} for {0}.
key-register.replaced=Replaced the session key {2} of {0} with {1}.
error.INVALID_PUBLIC_KEY=The public key is not an Ed25519 public key (X.509 DER in base64), as printed by the hook command session-key <server> <author> (for Codex Apps the server name is codex_apps.<app>). Nothing was registered.
error.FINGERPRINT_MISMATCH=The key has the fingerprint {0}, which is not the fingerprint you gave. Compare it with the one the session showed; if they differ, do not register this key. Nothing was registered.
error.DRIVER_NOT_CONFIGURED=No usable JDBC driver is registered, so this command cannot reach the ledger database. Register one with the driver-register command (a registered driver whose jar is missing or has changed is not usable either). Nothing was changed.
error.KEY_REPLACEMENT_NOT_CONFIRMED=The author already has the live key {0} (registered at {1}). A key is never replaced silently: if the owner really wants to replace it, run the command again with --replace={0}. Nothing was registered.
error.REPLACE_FINGERPRINT_STALE=The fingerprint given to --replace is not the one of the live key. The live key of the author is {0} (registered at {1}); to replace it, run the command again with --replace={0}. Nothing was registered.
error.KEY_IN_USE=This public key is already registered for another author. Nothing was registered.
error.INVALID_AUTHOR=The author is not valid: expected <vendor>:<session> (vendor in lower case, session of letters, digits, dot, underscore or hyphen), for example claude:session-1. Nothing was registered.
error.LEDGER_REFUSED=The ledger refused the request ({0}). Nothing was registered.
error.DATABASE_FAILED=The ledger database could not be reached or answered with an error (see the log). Nothing was registered.
error.MISSING_OPTION_VALUE=The option needs a value, written with an equals sign: --replace=<current-fingerprint>.
error.UNKNOWN_OPTION=Unknown option. See the usage for the options of the command; Spring properties have a dot in their name, for example --ledger.secrets.directory=<path>.
error.MISSING_COMMAND=No command was given.
error.UNKNOWN_COMMAND=Unknown command.
error.MISSING_ARGUMENT=A required argument is missing.
error.TOO_MANY_ARGUMENTS=Too many arguments.
error.INVALID_SECRET_NAME=The secret name is invalid. Allowed: a lowercase letter followed by up to 63 of a-z, 0-9, dot, underscore or hyphen.
error.NO_CONSOLE=The secret must be typed on an interactive terminal. No terminal is available (standard input or output is redirected), so nothing was read or stored.
error.EMPTY_SECRET=The input was empty. Nothing was stored.
error.INVALID_ENCODING=The input contains characters that cannot be encoded as UTF-8. Nothing was stored.
error.NON_POSIX_FILESYSTEM=The secrets directory {0} is on a file system without POSIX permissions, so owner-only modes cannot be guaranteed. Nothing was stored.
error.LOOSE_PERMISSIONS=Refusing to use {0}: its mode is {1} but only the owner may have access. Restrict the access to the owner and run the command again. Nothing was stored.
error.UNEXPECTED_FILE_TYPE=Refusing to use {0}: it is not a plain directory or file (a symbolic link or another file type).
error.FOREIGN_OWNER=Refusing to use {0}: it is owned by {1} but this command runs as {2}. The service reads its secrets with its own account, so run the command as the service account: sudo -u <service account> ledger-cli secret-set <name>. Nothing was stored.
error.UNKNOWN_PROCESS_USER=The account this process runs as could not be determined, so the owner of the secrets directory cannot be checked and no owner operation can be attributed to it. Nothing was stored or registered.
error.PARENT_MISSING=The parent directory {0} does not exist or is not a directory. The installation creates it; this command creates only the secrets directory itself. Nothing was stored.
error.IO_FAILED=Could not write the secret under {0}: {1}
