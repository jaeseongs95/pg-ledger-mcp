usage.header=Usage: java -jar ledger-cli.jar <command> [arguments] [--ledger.secrets.directory=<path>]
usage.secret-set=secret-set <name> [--stdin] [--if-absent]   Read a secret from the terminal (hidden input) and store it under <name>; --if-absent does nothing and asks for nothing when the secret exists already; --stdin reads it from the first line of standard input instead, for an installation without a terminal (the convention of docker login --password-stdin), and never from an argument or the environment
secret-set.prompt=Value for secret {0} (input is hidden):
secret-set.stored=Stored secret {0} at {1}
usage.key-register=key-register <author> <public-key-or-block> <fingerprint> [--replace=<current-fingerprint>]   Bind the public key a session printed (hook command session-key <server> <author>, the key printed for the server name of this ledger, for example ledger, or codex_apps.<app> for Codex Apps) to its author; the fingerprint is the one the session showed. An author that already has a live key is refused unless --replace names the fingerprint of that key
key-register.registered=Registered the session key {1} for {0}.
key-register.replaced=Replaced the session key {2} of {0} with {1}.
error.INVALID_PUBLIC_KEY=The public key is not an Ed25519 public key (X.509 DER in base64), as printed by the hook command session-key <server> <author> (for Codex Apps the server name is codex_apps.<app>). Nothing was registered.
error.FINGERPRINT_MISMATCH=The key has the fingerprint {0}, which is not the fingerprint you gave. Compare it with the one the session showed; if they differ, do not register this key. Nothing was registered.
error.DRIVER_NOT_CONFIGURED=No usable JDBC driver is registered, so this command cannot reach the ledger database. Register one with the driver-register command (a registered driver whose jar is missing or has changed is not usable either). Nothing was changed.
error.KEY_REPLACEMENT_NOT_CONFIRMED=The author already has the live key {0} (registered at {1}). A key is never replaced silently: if the owner really wants to replace it, run the command again with --replace={0}. Nothing was registered.
error.REPLACE_FINGERPRINT_STALE=The fingerprint given to --replace is not the one of the live key. The live key of the author is {0} (registered at {1}); to replace it, run the command again with --replace={0}. Nothing was registered.
error.KEY_IN_USE=This public key is already registered for another author. Nothing was registered.
error.INVALID_AUTHOR=The author is not valid (the owner role user:owner never has a key): expected <vendor>:<session> (vendor in lower case, session of letters, digits, dot, underscore or hyphen), for example claude:session-1. Nothing was registered.
error.LEDGER_REFUSED=The ledger refused the request ({0}). Nothing was changed.
error.DATABASE_FAILED=The ledger database could not be reached or answered with an error (see the log). Nothing was changed.
error.MISSING_OPTION_VALUE=An option needs a value, written with an equals sign: --name=<value>, for example --replace=<current-fingerprint>.
error.UNKNOWN_OPTION=Unknown option. See the usage for the options of the command; Spring properties have a dot in their name, for example --ledger.secrets.directory=<path>.
error.MISSING_COMMAND=No command was given.
error.UNKNOWN_COMMAND=Unknown command.
error.MISSING_ARGUMENT=A required argument is missing.
error.TOO_MANY_ARGUMENTS=Too many arguments.
error.INVALID_SECRET_NAME=The secret name is invalid. Allowed: a lowercase letter followed by up to 63 of a-z, 0-9, dot, underscore or hyphen.
error.NO_CONSOLE=The secret must be typed on an interactive terminal. No terminal is available (standard input or output is redirected), so nothing was read or stored.
error.EMPTY_SECRET=The input was empty. Nothing was stored.
error.INVALID_ENCODING=The input contains characters that cannot be encoded as UTF-8. Nothing was stored.
error.NON_POSIX_FILESYSTEM=The secrets directory {0} is on a file system with neither POSIX permissions nor ACLs, so owner-only access cannot be guaranteed. Nothing was stored.
error.LOOSE_PERMISSIONS=Refusing to use {0}: its access is {1} (a POSIX mode, or what the ACL allows) but only the owner may have access. Restrict the access to the owner and run the command again. Nothing was stored.
error.UNEXPECTED_FILE_TYPE=Refusing to use {0}: it is not a plain directory or file (a symbolic link or another file type).
error.FOREIGN_OWNER=Refusing to use {0}: it is owned by {1} but this command runs as {2}. The service reads its secrets with its own account, so run the command as the service account: sudo -u <service account> ledger-cli secret-set <name>. Nothing was stored.
error.UNKNOWN_PROCESS_USER=The account this process runs as could not be determined, so the owner of the secrets directory cannot be checked and no owner operation can be attributed to it. Nothing was stored or registered.
error.PARENT_MISSING=The parent directory {0} does not exist or is not a directory. The installation creates it; this command creates only the secrets directory itself. Nothing was stored.
error.IO_FAILED=Could not write the secret under {0}: {1}
usage.key-revoke=key-revoke <author> --fingerprint=<fingerprint>   Close the live public key of the author (the fingerprint is the confirmation: it must be the fingerprint of the key that is live now). The author keeps its grants and cannot sign until another key is registered
key-register.server=The key is the one that the session made for the server {0} (fingerprint {1}): compare the server with the name of this ledger.
key-revoke.revoked=Closed the session key {1} of {0}.
error.INVALID_KEY_BLOCK=The second operand is not the public key alone and not the four lines of the hook command session-key (server, author, public-key, fingerprint) as printed: a line is missing, repeated or changed, or the fingerprint line does not belong to the key. Copy the block from the session again. Nothing was registered.
error.KEY_BLOCK_AUTHOR_MISMATCH=The block is for the author {0}, not for {1}. Nothing was registered.
error.NO_LIVE_KEY=The author has no live session key. Nothing was closed.
error.REVOKE_FINGERPRINT_MISMATCH=The live key of the author has the fingerprint {0}, which is not the fingerprint you gave. Compare it with the key you mean to close; nothing was closed.
usage.driver-register=driver-register --jar=<path> --class=<driver-class>   Register the JDBC driver: the jar must be in the allowed driver directory, the class must be a java.sql.Driver that accepts the configured ledger.jdbc.url; the registration takes effect when the products start next. Needs no database
usage.migrate=migrate [--owner-account=<account>] [--app-account=<account>] [--stdin]   Apply the pending schema files to the ledger database (the schema_history table records every attempt); nothing is applied when the schema is up to date. --owner-account runs the command as that database account (the DDL account) instead of the configured one: its password is typed with hidden input and is not stored; --stdin takes it from the next line of standard input instead and needs --owner-account. --app-account applies the grant template (db-templates/dml-grants.sql, ANSI GRANT only) to the application account, the one account of the MCP server, the admin web and the owner commands, after the schema; both accounts are created beforehand with the tools of the DBMS
usage.project-add=project-add <id> <code> <title>   Add a project (id of letters, digits, underscore or hyphen; code is the prefix of its defect and task ids)
usage.code-set=code-set <group> <code> <name-ko> [<description-ko>] [--name-en=<text>] [--description-en=<text>] [--sort=<n>] [--inactive]   Add or update a common code (group DEFECT_CATEGORY, DEFECT_SEVERITY or RELATION_KIND); the code is active unless --inactive is given
usage.codes=codes [<group>]   List the common codes of a group, or of every group
usage.grant=grant <author> <project> <scope>... [--note=<text>] [--expires=<ISO-8601 with Z or an offset>]   Grant an author the scopes (defect, task, fix, verify) on a project; the author needs a live session key (register it with key-register first)
usage.revoke=revoke <author> [<project> [<scope>]]   Revoke the live grants of an author: all, those of a project, or one scope of a project
usage.grants=grants [<author>]   List the live grants of an author, or of every author
usage.mcp-check=mcp-check [--url=<url>] [--ledger.mcp.token=<token>]   Connect to a running MCP server with the MCP client, list its tools and check that every expected tool is there; the bearer token is the secret ledger.mcp.token (secret-set ledger.mcp.token) unless given as the property
migrate.applied=Applied {0} schema version(s): {1}.
migrate.current=The schema is up to date; nothing was applied.
driver-register.registered=Registered the JDBC driver {0} from {1} (sha256 {2}) in {3}. It takes effect when the products are started next.
driver-register.pending=The registration is not recorded in the audit trail of the owner yet, because the schema of the ledger database is not up to date. The next migrate or setup records it.
migrate.driver-audited=Recorded the registration of the JDBC driver {0} in the audit trail of the owner (it was made before the schema was ready).
project-add.added=Added the project {0} (code {1}): {2}
code-set.set=Set the code {0}/{1} (state {2}, sort order {3}); the code revision is {4}.
codes.line={0} {1} {2} {3} {4} / {5}
grant.issued=Granted {0} on the project {1}: scopes {2}, expires {3}, grant ids {4}.
grant.never=never
revoke.revoked=Revoked {0} live grant(s) of {1}.
grants.none=There are no live grants.
grants.line={0} {1} {2} expires {3} {4}
mcp-check.ok=The MCP server at {0} answered: {1} tools listed, all {2} expected tools are present.
error.INVALID_OPTION_VALUE=The value of an option is not valid, or the option takes no value (a flag such as --inactive is written without one). For --sort it must be a whole number; for --url it must be http or https with a host and without user information, query or fragment.
error.SCHEMA_NOT_READY=The ledger database is not ready: {0}. If the schema is pending or has no history, run the migrate command; the session and the JVM must run in UTC. Nothing was changed.
error.MIGRATION_FAILED=The schema migration stopped: {0}. See the log for the cause; repair it and run the migrate command again.
error.DRIVER_INVALID=The driver was not registered: {0}. The reason for a refused jar or class is in the log above; the jar must be a readable archive inside the allowed driver directory, written only by trusted accounts, and the class must be a java.sql.Driver that accepts the configured ledger.jdbc.url. The registration file was not changed.
error.DRIVER_FILE_FAILED=The registration file {0} could not be written (see the log). The previous registration, if any, is unchanged.
error.NO_SESSION_KEY=The author {0} has no live session key, so no write of this author could be accepted. Register the key the session printed first: key-register <author> <public-key-or-block> <fingerprint>. Nothing was granted.
error.MCP_TOKEN_MISSING=No bearer token is set. Store it with secret-set ledger.mcp.token (the secret store is read as the setting ledger.mcp.token), or give it as --ledger.mcp.token=<token>.
error.MCP_UNREACHABLE=The MCP server at {0} cannot be reached (connection refused, no route, an unknown host or a timeout). Check the URL and that the server is running.
error.MCP_AUTHORIZATION_REFUSED=The MCP server at {0} refused the request (401 or 403): the bearer token is wrong, or the host name of the URL is not on the server allow list.
error.MCP_FAILED=The MCP check of {0} failed: the server did not answer as an MCP server ({1}).
error.MCP_TOOL_MISSING=The MCP server at {0} does not list the expected tools: {1}.
usage.import-legacy=import-legacy [--verify-only] [--owner-account=<account>] [--stdin]   Copy the legacy ledger (the old schema ledger, read only; connection ledger.import.source.url and ledger.import.source.username, optional ledger.import.source.schema; the legacy credential is stored with secret-set, see the README) into the new schema in one transaction, then compare the row count and the SHA-256 digest of every table; --verify-only repeats only the comparison. It refuses when the new schema already holds ledger data. The grants are copied without a session key: register the key of each session with key-register. The import writes the whole ledger, which neither application account may do: --owner-account runs it as the owner account, whose password is typed with hidden input and is not stored (--stdin takes it from the first line of standard input instead and needs --owner-account)
import-legacy.table={0}: {1} rows, sha256 {2}
import-legacy.imported=Imported {0} rows of {1} tables from the legacy schema {2} in one transaction. Every table matches the legacy table (rows and sha256). The grants have no session key yet: register the key of each session with key-register, then its grants work.
import-legacy.verified=Verified {0} rows of {1} tables against the legacy schema {2}. Every table matches the legacy table (rows and sha256). Nothing was changed.
import-legacy.violation={0}: {1}
import-legacy.mismatch=Table {0}: {1} legacy rows but {2} rows in the new schema; sha256 {3} against {4}
error.IMPORT_SOURCE_NOT_CONFIGURED=The legacy ledger is not configured. Set ledger.import.source.url and ledger.import.source.username (ledger.import.source.schema is ledger unless the legacy schema has another name) and store the password with secret-set ledger.import.source.password. Nothing was changed.
error.IMPORT_TARGET_NOT_EMPTY=The new schema already holds ledger data or an earlier import ({0}). The import runs once, on a schema that only migrate and setup have prepared. Nothing was changed.
error.IMPORT_SOURCE_INCOMPLETE=The legacy ledger is not complete: the installer steps {0} are missing. It is older than the checkout 9fb62fe or it is not the legacy schema; bring it up to date with the old installer first. Nothing was written.
error.IMPORT_DATA_REFUSED={0} value(s) of the legacy ledger cannot be imported as they are (listed above, one per line: table[key].column and the reason). The import never invents a value: correct those rows in the legacy ledger and run the command again. Nothing was written.
error.IMPORT_VERIFY_FAILED=The legacy ledger and the new schema differ in the table {0}: {1} legacy rows (sha256 {3}) against {2} rows in the new schema (sha256 {4}). The import was rolled back and nothing was written; a verification changes nothing.
usage.token-generate=token-generate <name> [--print] [--copy-to=<name>]   Generate a random bearer token (32 bytes from SecureRandom) and store it as the secret <name> in the secret directory; an existing secret is kept and never replaced. --print shows a token that was just created, once, so that it can be put into the client configuration; a kept token is never shown
token-generate.created=Generated and stored the secret {0} at {1}.
token-generate.kept=The secret {0} already exists and was kept; nothing was generated.
token-generate.copied=Stored the value of the secret {0} also as the secret {1} at {2}.
secret-set.kept=The secret {0} already exists and was kept; nothing was read.
token-generate.printed=Token {0}, shown only now (copy it into the client configuration): {1}
usage.render-deploy=render-deploy --java=<path> --jdbc-url=<url> --app-account=<account> [--name=<name>] [--platform=<platform>] [--home=<path>] [--schema=<name>] [--long-text-type=<type>] [--mcp-port=<n>] [--admin-port=<n>] [--mcp-host=<host> --admin-host=<host>] [--nginx-conf=<path> (--tls-certificate=<path> --tls-key=<path> | --tls-acme [--acme-directory=<url>])] [--root=<directory>] [--check]   Write the definition of the two services (the platform is linux, the default, which writes systemd units, or windows, which writes WinSW configurations and needs the installation directory --home), their settings files and, on Linux when --nginx-conf is given, the nginx site of the two public host names with the TLS certificate and key of the operator (no certificate is made). With --tls-acme in place of the operator's certificate and key the certificate is automatic (tls-issue and tls-renew): the site gets a port 80 block for each host name (the HTTP-01 proof, a redirect to https), the 443 blocks are written once the certificate files exist (render-deploy looks at them), and a systemd service and timer renew the certificate; --acme-directory names a certificate authority other than the default one. The instance is called pg-ledger-mcp unless --name gives another name (lower-case letters, digits and hyphens, at most 23 characters, not ending with -admin): the services are <name> and <name>-admin, and the Linux user, the directories and the WinSW ids follow the name, so two instances can live on one host with their own ports. The services run as one service account; both use the one application account of the database. --check validates every option and writes nothing. The files hold no secret and the output is deterministic; --root writes below a directory instead of at the paths of the files. Used by deploy/install.sh and deploy/install.cmd
render-deploy.written=Wrote {0}
render-deploy.kept=Kept the previous file of that name as {0}: this command did not render it (a unit of 1.x). It is not deleted; put it back to return to the old installation.
render-deploy.kept-existing=The backup {0} of the previous file of that name already holds the same bytes as that file (a rollback put the file back): the backup is left as it is and the file is replaced. Put the backup back to return to the old installation.
render-deploy.checked=The options are valid for the instance {0}; nothing was written.
migrate.granted=Applied the grants of the application account to the account {0}.
owner-account.prompt=Password of the owner account {0} (input is hidden; it is used for this run only and is not stored):
error.INVALID_DEPLOY_VALUE=The value of the option --{0} cannot be used in the deployment files: see the usage for what it takes (absolute paths of plain characters, lower-case host names, plain account names, ports from 1024, a JDBC URL without a password). Nothing was written.
error.DEPLOY_WRITE_FAILED=Could not write {0} ({1}). The files written before it are complete; run the command again after fixing the cause.
error.GRANT_FAILED=The grants could not be applied (see the log above). The schema is migrated. The accounts must exist (create them with the tools of the DBMS before the installation) and the owner account must be allowed to grant. Nothing of the grants is half-applied that the next run would not repeat.
error.SECRET_TOO_LONG=The input line is longer than 1024 bytes, which is more than a secret needs. Nothing was stored.
error.STDIN_FAILED=Standard input could not be read ({0}). Nothing was stored.
error.ENV_FILE_FAILED=The 1.x environment file could not be read ({0}). Nothing was stored.
error.ENV_KEYS_MISSING=The 1.x environment has no value for {0}. Nothing was stored.
error.INVALID_1X_VALUE=The 1.x setting {0} cannot be used as a secret (it is shorter than 16 characters, or the admin token equals the agent token). Nothing was stored.
usage.secret-import-1x=secret-import-1x [--env=<file>] [--stdin]   Move the secrets of a 1.x installation into the secret store: DBHUB_AUTH_TOKEN becomes ledger.mcp.token and ledger.admin.agent-token, PGLEDGER_ADMIN_TOKEN becomes ledger.admin.token, so the clients and the admin sign-in keep working. The 1.x environment file (KEY=VALUE lines) is read with --env=<file>, or from standard input with --stdin (the file of 1.x is owned by root and the secret store by the service account, so the installer opens the file and pipes it in). Exactly one of the two is given. A secret that exists is kept and never replaced; values are never printed, only the names of the secrets
secret-import-1x.stored=Stored the secret {0} from the 1.x setting {1}.
secret-import-1x.kept=The secret {0} already exists and was kept.
secret-import-1x.no-admin=The 1.x environment has no {0} (a 1.0.0 installation had no admin web), so {1} was not imported: the installer generates it and shows it once.
error.HOST_FAILED=Could not prepare the host at {0} ({1}). Run the command as root (Linux) or in an elevated prompt (Windows); the service user must exist on Linux. What was done before is complete; run the command again after fixing the cause.
error.HOST_UNSUPPORTED=This command needs a file system with the attribute view {0}, or a Windows instance (--platform=windows). Nothing was changed.
usage.prepare-host=prepare-host --jars=<dir> --driver-jar=<file> [--winsw=<file>] --java=<path> --jdbc-url=<url> --app-account=<account> [--name=<name>] [--platform=<platform>] [--home=<path>] [--schema=<name>] [--long-text-type=<type>] [--mcp-port=<n>] [--admin-port=<n>] [--mcp-host=<host> --admin-host=<host>] [--nginx-conf=<path> (--tls-certificate=<path> --tls-key=<path> | --tls-acme [--acme-directory=<url>])] [--root=<directory>]   Prepare the files of the host for an installation (run as root, or in an elevated prompt on Windows), in place of the operating system commands: create the directories with their owner and mode (Linux: the service user owns the settings and the secret directory) or close the home to every account but SYSTEM and Administrators and give the secrets of an earlier run back to the installer (Windows), copy the three jars from the directory and the JDBC driver jar (on Windows also the WinSW executable, --winsw, once for each service), and render the files as render-deploy does; a file of 1.x that a rendered file replaces is kept as <file>.1x-backup. All options are validated before anything is changed
prepare-host.prepared=Prepared the host for the instance {0}.
usage.seal-host=seal-host --java=<path> --jdbc-url=<url> --app-account=<account> [--name=<name>] [--platform=<platform>] [--home=<path>] [--schema=<name>] [--long-text-type=<type>] [--mcp-port=<n>] [--admin-port=<n>] [--mcp-host=<host> --admin-host=<host>] [--nginx-conf=<path> (--tls-certificate=<path> --tls-key=<path> | --tls-acme [--acme-directory=<url>])] [--root=<directory>]   Windows, after the secrets are stored and the services are registered: give the one service account (LocalService) the access it needs to the jars, the settings and the logs, hand the secrets over to it (the files first, then the folder; Administrators can only see that a file exists, nobody else has access) and finish with the ACLs of the folders. Refused for a Linux instance
seal-host.sealed=Handed the secrets of the instance {0} to the service account and set the access of the folders.
usage.setup=setup [--owner-account=<account>] [--app-account=<account>] [--stdin]   First setup of the ledger database: apply the pending schema files (as migrate does, with the same three options), check that the application account can use the schema (if it cannot, exit code 3 and which step is missing), add the seed codes that are missing through the code service (a code that exists is never changed) and compare the seed with the database by counts and digest. Running it again changes nothing.
usage.install-default=install-default <name>   Print one default of the installation from the seed bundle (instance-name, mcp-port or admin-port); the installers ask for their defaults with this command.
setup.seeded=Added {0} seed code(s) through the code service.
setup.report=Seed check: {0} codes in the seed, {1} present in the database, {2} equal to the seed, {3} changed by the operator and kept; digest of the seed {4}, digest of the same codes in the database {5}.
error.APP_ACCOUNT_NO_ACCESS=The application account {0} cannot use the ledger schema yet. The schema is migrated and nothing else was changed. An operator has to let this account use the schema with the tools of the database system: the privilege to use a schema is not part of the product SQL. Then run setup again; it continues where it stopped.
usage.tls-issue=tls-issue --mcp-host=<host> --admin-host=<host> [--name=<name>] [--webroot=<dir>] [--tls-dir=<dir>] [--acme-directory=<url>] [--acme-email=<address>] [--agree-tos]   Order a certificate for the two public host names from a certificate authority that speaks ACME (RFC 8555) and write fullchain.pem and privkey.pem (PEM, any proxy can use them) into the TLS directory next to the account key. The proof is HTTP-01: the token file is written below the web root, which the web server has to serve on port 80. The authority is --acme-directory (default the production directory of Let's Encrypt, https://acme-v02.api.letsencrypt.org/directory); the web root and the TLS directory default to the layout of the instance --name. The first run creates the account and needs --agree-tos (the terms of service of the authority are agreed to by this option only); --acme-email is an optional contact address. The keys are made with the JDK, stored owner-only and never printed; the files are replaced atomically and a failed order leaves the old ones. Needs no database
usage.tls-renew=tls-renew --mcp-host=<host> --admin-host=<host> [--name=<name>] [--webroot=<dir>] [--tls-dir=<dir>] [--acme-directory=<url>] [--renew-before-days=<n>]   Order a new certificate with the account of tls-issue when the certificate in the TLS directory expires within --renew-before-days (default 30) or does not name exactly the two host names; otherwise order nothing and say so. It never creates an account and needs no terms option. Run by the timer that render-deploy --tls-acme writes. Needs no database
tls.issued=Obtained the certificate for {0}: {1} and {2}. It is valid until {3}.
tls.not-due=The certificate for {0} is valid until {1} and is not due for renewal (it is renewed when it expires within {2} days). Nothing was ordered.
tls.cleanup-failed=Could not remove the challenge file {0} ({1}). Remove it by hand.
error.TLS_TERMS_NOT_AGREED=There is no ACME account yet, and creating one means agreeing to the terms of service of the certificate authority. Read them at the authority, then run the command again with --agree-tos. Nothing was ordered.
error.TLS_CHALLENGE_TOKEN=The certificate authority offered a challenge token that is not a plain token (letters, digits, hyphen and underscore only), so no file was written for it. Nothing was changed.
error.TLS_ISSUE_FAILED=The certificate could not be obtained at the step {0} ({1}). The files of an earlier certificate are unchanged. Check that the host names point to this server and that port 80 reaches the web root, then run the command again.
error.TLS_NO_CERTIFICATE=There is no certificate at {0} to renew; run tls-issue first.
error.TLS_NO_ACCOUNT=There is no ACME account key at {0}; a renewal never creates an account. Run tls-issue first.
error.TLS_FILES_FAILED=Could not write {0} ({1}). The files of an earlier certificate are unchanged.
error.SEED_UNAVAILABLE=The seed bundle of this program cannot be read ({0}). The installation is incomplete or damaged; install the program again. Nothing was changed.
