usage.header=사용법: java -jar ledger-cli.jar <명령> [인자] [--ledger.secrets.directory=<경로>]
usage.secret-set=secret-set <이름> [--stdin] [--if-absent]   터미널에서 숨김 입력으로 비밀 값을 받아 <이름>으로 저장. --if-absent는 비밀이 이미 있으면 아무것도 묻거나 하지 않음. --stdin은 터미널이 없는 설치를 위해 표준 입력의 첫 줄에서 값을 받음(README 참조). 인수나 환경 변수로는 받지 않음
secret-set.prompt=비밀 {0}의 값 (입력은 화면에 표시되지 않음):
secret-set.stored=비밀 {0}을(를) {1}에 저장했습니다.
usage.key-register=key-register <작성자> <공개키-또는-블록> <지문> [--replace=<현재-지문>]   세션이 출력한 공개 키(훅 명령 session-key <서버> <작성자>, 이 장부 서버에 해당하는 서버 이름의 키: 예 ledger, Codex Apps는 codex_apps.<앱>)를 작성자에 묶음. 지문은 세션이 보여 준 값. 이미 유효한 키가 있는 작성자는 --replace가 그 키의 지문을 지정하지 않으면 거부됨
key-register.registered={0}의 세션 키 {1}을(를) 등록했습니다.
key-register.replaced={0}의 세션 키 {2}을(를) {1}(으)로 교체했습니다.
error.INVALID_PUBLIC_KEY=공개 키가 Ed25519 공개 키(base64로 쓴 X.509 DER)가 아닙니다. 훅 명령 session-key <서버> <작성자>(Codex Apps는 서버 이름 codex_apps.<앱>)가 출력한 값을 쓰세요. 아무것도 등록하지 않았습니다.
error.FINGERPRINT_MISMATCH=이 키의 지문은 {0}이고, 입력한 지문과 다릅니다. 세션이 보여 준 지문과 대조하고, 다르면 이 키를 등록하지 마세요. 아무것도 등록하지 않았습니다.
error.DRIVER_NOT_CONFIGURED=사용할 수 있는 JDBC 드라이버가 등록되어 있지 않아 이 명령은 원장 데이터베이스에 접근할 수 없습니다. driver-register 명령으로 드라이버를 등록하십시오(등록된 드라이버의 jar가 없거나 바뀌었으면 그것도 사용할 수 없습니다). 아무것도 변경하지 않았습니다.
error.KEY_REPLACEMENT_NOT_CONFIRMED=이 작성자에게는 이미 유효한 키 {0}이(가) 있습니다({1}에 등록). 키는 조용히 교체되지 않습니다. 소유자가 정말 교체하려면 --replace={0} 를 붙여 명령을 다시 실행하십시오. 아무것도 등록하지 않았습니다.
error.REPLACE_FINGERPRINT_STALE=--replace에 준 지문이 유효한 키의 지문과 다릅니다. 이 작성자의 유효한 키는 {0}입니다({1}에 등록). 교체하려면 --replace={0} 를 붙여 명령을 다시 실행하십시오. 아무것도 등록하지 않았습니다.
error.KEY_IN_USE=이 공개 키는 이미 다른 작성자에게 등록되어 있습니다. 아무것도 등록하지 않았습니다.
error.INVALID_AUTHOR=작성자가 올바르지 않습니다(소유자 역할 user:owner에는 키를 등록하지 않습니다). <공급자>:<세션> 형식이어야 합니다(공급자는 영문 소문자, 세션은 영문자·숫자·점·밑줄·하이픈). 예: claude:session-1. 아무것도 등록하지 않았습니다.
error.LEDGER_REFUSED=원장이 요청을 거부했습니다({0}). 아무것도 변경하지 않았습니다.
error.DATABASE_FAILED=원장 데이터베이스에 접근하지 못했거나 데이터베이스가 오류로 응답했습니다(로그 참고). 아무것도 변경하지 않았습니다.
error.MISSING_OPTION_VALUE=옵션에 값이 필요하며 등호로 이어 씁니다: --이름=<값>, 예: --replace=<현재-지문>.
error.UNKNOWN_OPTION=알 수 없는 옵션입니다. 명령의 옵션은 사용법을 보십시오. Spring 속성은 이름에 점이 있습니다(예: --ledger.secrets.directory=<경로>).
error.MISSING_COMMAND=명령이 지정되지 않았습니다.
error.UNKNOWN_COMMAND=알 수 없는 명령입니다.
error.MISSING_ARGUMENT=필요한 인자가 없습니다.
error.TOO_MANY_ARGUMENTS=인자가 너무 많습니다.
error.INVALID_SECRET_NAME=비밀 이름이 올바르지 않습니다. 허용: 영문 소문자로 시작하고 이어서 a-z, 0-9, 점, 밑줄, 하이픈이 최대 63자.
error.NO_CONSOLE=비밀 값은 대화형 터미널에서 직접 입력해야 합니다. 터미널이 없어(표준 입력 또는 출력이 리디렉션됨) 아무것도 읽거나 저장하지 않았습니다.
error.EMPTY_SECRET=입력이 비어 있어 아무것도 저장하지 않았습니다.
error.INVALID_ENCODING=입력에 UTF-8로 인코딩할 수 없는 문자가 있어 아무것도 저장하지 않았습니다.
error.NON_POSIX_FILESYSTEM=비밀 디렉터리 {0}은(는) POSIX 권한도 ACL도 없는 파일 시스템에 있어 소유자 전용 접근을 보장할 수 없습니다. 아무것도 저장하지 않았습니다.
error.LOOSE_PERMISSIONS={0}을(를) 사용하지 않습니다: 접근 설정이 {1}(POSIX 모드, 또는 ACL이 허용하는 것)이며 소유자만 접근할 수 있어야 합니다. 접근 권한을 소유자 전용으로 좁힌 뒤 다시 실행하십시오. 아무것도 저장하지 않았습니다.
error.UNEXPECTED_FILE_TYPE={0}을(를) 사용하지 않습니다: 일반 디렉터리나 파일이 아닙니다(심볼릭 링크 또는 다른 종류).
error.FOREIGN_OWNER={0}을(를) 사용하지 않습니다: 소유자는 {1}인데 이 명령은 {2} 계정으로 실행 중입니다. 서비스는 자기 계정으로 비밀을 읽으므로 서비스 계정으로 실행하십시오: sudo -u <서비스 계정> ledger-cli secret-set <이름>. 아무것도 저장하지 않았습니다.
error.UNKNOWN_PROCESS_USER=이 프로세스의 실행 계정을 알 수 없어 비밀 디렉터리의 소유자를 확인할 수 없고 소유자 작업을 이 계정에 귀속할 수도 없습니다. 아무것도 저장하거나 등록하지 않았습니다.
error.PARENT_MISSING=상위 디렉터리 {0}이(가) 없거나 디렉터리가 아닙니다. 상위 디렉터리는 설치 단계가 만들며, 이 명령은 비밀 디렉터리 자신만 만듭니다. 아무것도 저장하지 않았습니다.
error.IO_FAILED={0} 아래에 비밀을 쓰지 못했습니다: {1}
usage.key-revoke=key-revoke <작성자> --fingerprint=<지문>   작성자의 유효한 공개 키를 닫음(지문이 확인 절차이며, 지금 유효한 키의 지문이어야 함). 작성자의 부여는 그대로이며 다른 키를 등록할 때까지 서명할 수 없음
key-register.server=이 키는 세션이 서버 {0}용으로 만든 키입니다(지문 {1}). 서버 이름을 이 장부의 이름과 비교하세요.
key-revoke.revoked={0}의 세션 키 {1}을(를) 닫았습니다.
error.INVALID_KEY_BLOCK=두 번째 인자가 공개 키만 있는 것도, 훅 명령 session-key가 출력한 네 줄(server, author, public-key, fingerprint) 그대로도 아닙니다. 줄이 빠졌거나 반복되었거나 바뀌었거나, fingerprint 줄이 키와 맞지 않습니다. 세션에서 블록을 다시 복사하세요. 아무것도 등록하지 않았습니다.
error.KEY_BLOCK_AUTHOR_MISMATCH=이 블록은 작성자 {0}의 것이며 {1}의 것이 아닙니다. 아무것도 등록하지 않았습니다.
error.NO_LIVE_KEY=이 작성자에게는 유효한 세션 키가 없습니다. 아무것도 닫지 않았습니다.
error.REVOKE_FINGERPRINT_MISMATCH=이 작성자의 유효한 키의 지문은 {0}이고, 입력한 지문과 다릅니다. 닫으려는 키와 대조하세요. 아무것도 닫지 않았습니다.
usage.driver-register=driver-register --jar=<경로> --class=<드라이버-클래스>   JDBC 드라이버 등록: jar는 허용된 드라이버 디렉터리 안에 있어야 하고, 클래스는 설정된 ledger.jdbc.url을 받아들이는 java.sql.Driver여야 함. 등록은 제품이 다음에 시작될 때 적용됨. 데이터베이스 불필요
usage.migrate=migrate [--owner-account=<계정>] [--app-account=<계정>] [--stdin]   대기 중인 스키마 파일을 원장 데이터베이스에 적용(schema_history 표에 모든 시도가 기록됨). 스키마가 최신이면 아무것도 적용하지 않음. --owner-account는 설정된 계정 대신 그 데이터베이스 계정(DDL 계정)으로 실행하며, 비밀번호는 숨김 입력으로 받고 저장하지 않음(--stdin은 숨김 입력 대신 표준 입력의 다음 줄에서 받으며 --owner-account가 필요함). --app-account는 스키마 적용 뒤에 권한 템플릿(db-templates/dml-grants.sql, ANSI GRANT만)을 앱 계정(MCP 서버·관리 웹·소유자 명령이 함께 쓰는 하나의 계정)에 적용함. 두 계정은 미리 DBMS 도구로 만들어 둠
usage.project-add=project-add <id> <코드> <제목>   프로젝트 추가(id는 영문자·숫자·밑줄·하이픈, 코드는 결함과 작업 ID의 접두어)
usage.code-set=code-set <그룹> <코드> <이름-ko> [<설명-ko>] [--name-en=<문구>] [--description-en=<문구>] [--sort=<n>] [--inactive]   공통 코드 추가 또는 수정(그룹 DEFECT_CATEGORY, DEFECT_SEVERITY, RELATION_KIND). --inactive가 없으면 활성 코드
usage.codes=codes [<그룹>]   한 그룹 또는 모든 그룹의 공통 코드 목록
usage.grant=grant <작성자> <프로젝트> <범위>... [--note=<문구>] [--expires=<Z 또는 오프셋이 붙은 ISO-8601>]   작성자에게 프로젝트의 범위(defect, task, fix, verify)를 부여. 작성자에게 유효한 세션 키가 있어야 함(먼저 key-register로 등록)
usage.revoke=revoke <작성자> [<프로젝트> [<범위>]]   작성자의 유효한 부여 회수: 전체, 한 프로젝트, 또는 한 프로젝트의 한 범위
usage.grants=grants [<작성자>]   한 작성자 또는 모든 작성자의 유효한 부여 목록
usage.mcp-check=mcp-check [--url=<url>] [--ledger.mcp.token=<토큰>]   실행 중인 MCP 서버에 MCP 클라이언트로 접속해 도구 목록을 읽고 기대하는 도구가 모두 있는지 확인. 베어러 토큰은 비밀 ledger.mcp.token(secret-set ledger.mcp.token)이며, 속성으로 줄 수도 있음
migrate.applied=스키마 버전 {0}개를 적용했습니다: {1}.
migrate.current=스키마가 최신입니다. 적용한 것이 없습니다.
driver-register.registered=JDBC 드라이버 {0}을(를) {1}에서 등록했습니다(sha256 {2}), 파일 {3}. 제품이 다음에 시작될 때 적용됩니다.
project-add.added=프로젝트 {0}을(를) 추가했습니다(코드 {1}): {2}
code-set.set=코드 {0}/{1}을(를) 설정했습니다(상태 {2}, 정렬 순서 {3}). 코드 리비전은 {4}입니다.
codes.line={0} {1} {2} {3} {4} / {5}
grant.issued={0}에게 프로젝트 {1}의 범위 {2}을(를) 부여했습니다. 만료 {3}, 부여 ID {4}.
grant.never=없음
revoke.revoked={1}의 유효한 부여 {0}건을 회수했습니다.
grants.none=유효한 부여가 없습니다.
grants.line={0} {1} {2} 만료 {3} {4}
mcp-check.ok=MCP 서버 {0}이(가) 응답했습니다: 도구 {1}개를 확인했고 기대하는 도구 {2}개가 모두 있습니다.
error.INVALID_OPTION_VALUE=옵션 값이 올바르지 않거나, 값을 받지 않는 옵션입니다(--inactive 같은 플래그는 값 없이 씁니다). --sort는 정수, --url은 호스트가 있는 http 또는 https이며 사용자 정보·쿼리·프래그먼트가 없어야 합니다.
error.SCHEMA_NOT_READY=원장 데이터베이스를 사용할 준비가 되지 않았습니다: {0}. 스키마가 대기 중이거나 이력이 없으면 migrate 명령을 실행하십시오. 세션과 JVM은 UTC여야 합니다. 아무것도 변경하지 않았습니다.
error.MIGRATION_FAILED=스키마 이전이 중단되었습니다: {0}. 원인은 로그를 보고 복구한 뒤 migrate 명령을 다시 실행하십시오.
error.DRIVER_INVALID=드라이버를 등록하지 않았습니다: {0}. 거부된 jar나 클래스의 이유는 위의 로그에 있습니다. jar는 허용된 드라이버 디렉터리 안의 읽을 수 있는 아카이브이고 신뢰된 계정만 쓸 수 있어야 하며, 클래스는 설정된 ledger.jdbc.url을 받아들이는 java.sql.Driver여야 합니다. 등록 파일은 바뀌지 않았습니다.
error.DRIVER_FILE_FAILED=등록 파일 {0}을(를) 쓰지 못했습니다(로그 참고). 이전 등록이 있으면 그대로입니다.
error.NO_SESSION_KEY=작성자 {0}에게 유효한 세션 키가 없어 이 작성자의 쓰기를 받아들일 수 없습니다. 먼저 세션이 출력한 키를 등록하십시오: key-register <작성자> <공개키-또는-블록> <지문>. 아무것도 부여하지 않았습니다.
error.MCP_TOKEN_MISSING=베어러 토큰이 설정되어 있지 않습니다. secret-set ledger.mcp.token으로 저장하거나(비밀 저장소는 설정 ledger.mcp.token으로 읽힙니다) --ledger.mcp.token=<토큰>으로 주십시오.
error.MCP_UNREACHABLE=MCP 서버 {0}에 연결할 수 없습니다(연결 거부, 경로 없음, 알 수 없는 호스트 또는 시간 초과). URL과 서버 실행 여부를 확인하십시오.
error.MCP_AUTHORIZATION_REFUSED=MCP 서버 {0}이(가) 요청을 거부했습니다(401 또는 403): 베어러 토큰이 틀렸거나 URL의 호스트 이름이 서버의 허용 목록에 없습니다.
error.MCP_FAILED=MCP 확인 {0}이(가) 실패했습니다: 서버가 MCP 서버로 응답하지 않았습니다({1}).
error.MCP_TOOL_MISSING=MCP 서버 {0}에 기대하는 도구가 없습니다: {1}.
usage.import-legacy=import-legacy [--verify-only] [--owner-account=<계정>] [--stdin]옛 원장(옛 스키마 ledger, 읽기 전용. 접속 ledger.import.source.url·ledger.import.source.username, 선택 ledger.import.source.schema. 옛 원장의 인증 값은 secret-set으로 저장하며 README 참조)을 하나의 트랜잭션으로 새 스키마에 옮긴 뒤 모든 표의 행 수와 SHA-256 요약값을 대조합니다. --verify-only는 대조만 다시 합니다. 새 스키마에 이미 원장 데이터가 있으면 거절합니다. 부여는 세션 키 없이 옮겨지므로 세션마다 key-register로 키를 등록해야 합니다. 가져오기는 원장 전체를 쓰는데 두 응용 계정은 그럴 수 없으므로, --owner-account로 소유자 계정으로 실행하며 그 비밀번호는 숨김 입력으로 받고 저장하지 않습니다(--stdin은 숨김 입력 대신 표준 입력의 첫 줄에서 받으며 --owner-account가 필요합니다)
import-legacy.table={0}: {1}행, sha256 {2}
import-legacy.imported=옛 스키마 {2}의 표 {1}개, {0}행을 하나의 트랜잭션으로 가져왔습니다. 모든 표가 옛 표와 일치합니다(행 수와 sha256). 부여에는 아직 세션 키가 없습니다. 세션마다 key-register로 키를 등록하면 그 부여가 작동합니다.
import-legacy.verified=옛 스키마 {2}의 표 {1}개, {0}행을 확인했습니다. 모든 표가 옛 표와 일치합니다(행 수와 sha256). 바뀐 것은 없습니다.
import-legacy.violation={0}: {1}
import-legacy.mismatch=표 {0}: 옛 표는 {1}행이지만 새 스키마는 {2}행입니다. sha256 {3}, {4}
error.IMPORT_SOURCE_NOT_CONFIGURED=옛 원장이 설정되어 있지 않습니다. ledger.import.source.url과 ledger.import.source.username을 설정하고(옛 스키마 이름이 ledger가 아니면 ledger.import.source.schema도), 비밀번호는 secret-set ledger.import.source.password로 저장하십시오. 바뀐 것은 없습니다.
error.IMPORT_TARGET_NOT_EMPTY=새 스키마에 이미 원장 데이터가 있습니다({0}). 가져오기는 방금 migrate한 스키마에 한 번만 실행합니다. 바뀐 것은 없습니다.
error.IMPORT_SOURCE_INCOMPLETE=옛 원장이 완전하지 않습니다. 설치기 단계 {0}이(가) 없습니다. 체크아웃 9fb62fe보다 오래되었거나 옛 스키마가 아닙니다. 먼저 옛 설치기로 최신으로 맞추십시오. 쓴 것은 없습니다.
error.IMPORT_DATA_REFUSED=옛 원장의 값 {0}개를 그대로 가져올 수 없습니다(위에 한 줄씩 표[키].열과 이유를 적었습니다). 가져오기는 값을 지어내지 않습니다. 옛 원장에서 그 행을 고친 뒤 명령을 다시 실행하십시오. 쓴 것은 없습니다.
error.IMPORT_VERIFY_FAILED=옛 원장과 새 스키마가 표 {0}에서 다릅니다. 옛 표 {1}행(sha256 {3}), 새 스키마 {2}행(sha256 {4}). 가져오기는 되돌려졌고 쓴 것은 없습니다. 확인만 한 경우에도 바뀐 것은 없습니다.
usage.token-generate=token-generate <이름> [--print] [--copy-to=<이름>]무작위 bearer 토큰(SecureRandom 32바이트)을 만들어 비밀 디렉터리에 비밀 <이름>으로 저장. 이미 있는 비밀은 그대로 두고 바꾸지 않음. --print는 방금 만든 토큰을 한 번만 보여 주어 클라이언트 설정에 넣게 함. 남겨 둔 토큰은 다시 보여 주지 않음. --copy-to는 같은 값을 두 번째 이름으로도 한 번 저장함(이미 있으면 바꾸지 않음. 관리 웹은 에이전트 토큰을 알아야 그것을 거부할 수 있음)
token-generate.created=비밀 {0}을(를) 만들어 {1}에 저장했습니다.
token-generate.kept=비밀 {0}이(가) 이미 있어 그대로 두었습니다. 새로 만든 것은 없습니다.
token-generate.copied=비밀 {0}의 값을 비밀 {1}로도 {2}에 저장했습니다.
secret-set.kept=비밀 {0}이(가) 이미 있어 그대로 두었습니다. 입력은 읽지 않았습니다.
token-generate.printed=토큰 {0}, 지금 한 번만 표시합니다(클라이언트 설정에 복사하세요): {1}
usage.render-deploy=render-deploy --java=<경로> --jdbc-url=<url> --app-account=<계정> [--name=<이름>] [--platform=<플랫폼>] [--home=<경로>] [--schema=<이름>] [--long-text-type=<형>] [--mcp-port=<n>] [--admin-port=<n>] [--mcp-host=<호스트> --admin-host=<호스트>] [--nginx-conf=<경로> --tls-certificate=<경로> --tls-key=<경로>] [--root=<디렉터리>] [--check]   두 서비스의 정의(플랫폼은 linux(기본값, systemd 유닛을 씀) 또는 windows(WinSW 설정을 쓰며 설치 디렉터리 --home이 필요함)), 그 설정 파일, 그리고 Linux에서 --nginx-conf가 있으면 운영자의 TLS 인증서와 키로 두 공개 호스트 이름을 서비스하는 nginx 사이트를 씀(인증서는 만들지 않음). 인스턴스 이름은 --name이 다른 이름을 주지 않으면 pg-ledger-mcp(소문자, 숫자, 하이픈, 23자 이내, -admin으로 끝나지 않음)이며, 서비스는 <이름>과 <이름>-admin이고 Linux 사용자, 디렉터리, WinSW id가 이름을 따르므로 한 호스트에 인스턴스 둘을 각자의 포트로 둘 수 있음. 서비스는 서비스 계정 하나로 실행하고 둘 다 데이터베이스의 앱 계정 하나를 씀. --check는 모든 옵션을 검증하고 아무것도 쓰지 않음. 파일에 비밀은 없고 출력은 결정적이며, --root는 파일 자신의 경로 대신 그 디렉터리 아래에 씀. deploy/install.sh와 deploy/install.cmd가 사용
render-deploy.written={0}을(를) 썼습니다.
render-deploy.kept=같은 이름의 이전 파일을 {0}(으)로 보관했습니다. 이 명령이 만든 파일이 아닙니다(1.x의 유닛). 삭제하지 않았으며, 옛 설치로 돌아가려면 이 파일을 되돌리면 됩니다.
render-deploy.checked=옵션은 인스턴스 {0}에 유효합니다. 아무것도 쓰지 않았습니다.
migrate.granted=앱 계정의 권한을 계정 {0}에 적용했습니다.
owner-account.prompt=소유자 계정 {0}의 비밀번호 (입력은 화면에 표시되지 않으며, 이번 실행에서만 쓰고 저장하지 않음):
error.INVALID_DEPLOY_VALUE=옵션 --{0}의 값을 배포 파일에 쓸 수 없습니다. 받는 형식은 사용법을 보세요(일반 문자로 된 절대 경로, 소문자 호스트 이름, 일반 계정 이름, 1024 이상의 포트, 비밀번호가 없는 JDBC URL). 아무것도 쓰지 않았습니다.
error.DEPLOY_WRITE_FAILED={0}을(를) 쓸 수 없습니다({1}). 그 앞에 쓴 파일은 완결되어 있습니다. 원인을 고친 뒤 명령을 다시 실행하세요.
error.GRANT_FAILED=권한을 적용하지 못했습니다(위 로그 참고). 스키마는 적용되었습니다. 계정은 설치 전에 DBMS 도구로 만들어 두어야 하고, 소유자 계정은 권한을 부여할 수 있어야 합니다. 권한 중 반쯤 적용된 것은 다음 실행이 그대로 되풀이합니다.
error.SECRET_TOO_LONG=입력 줄이 1024바이트보다 길어 비밀로 쓰기에 지나치게 깁니다. 아무것도 저장하지 않았습니다.
error.STDIN_FAILED=표준 입력을 읽지 못했습니다({0}). 아무것도 저장하지 않았습니다.
error.ENV_FILE_FAILED=1.x 환경 파일을 읽지 못했습니다({0}). 아무것도 저장하지 않았습니다.
error.ENV_KEYS_MISSING=1.x 환경에 {0}의 값이 없습니다. 아무것도 저장하지 않았습니다.
error.INVALID_1X_VALUE=1.x 설정 {0}은(는) 비밀로 쓸 수 없습니다(16자보다 짧거나, 관리자 토큰이 에이전트 토큰과 같습니다). 아무것도 저장하지 않았습니다.
usage.secret-import-1x=secret-import-1x [--env=<파일>] [--stdin]   1.x 설치의 비밀을 비밀 저장소로 옮김. DBHUB_AUTH_TOKEN은 ledger.mcp.token과 ledger.admin.agent-token이 되고 PGLEDGER_ADMIN_TOKEN은 ledger.admin.token이 되어 클라이언트와 관리자 로그인이 그대로 동작함. 1.x 환경 파일(KEY=VALUE 줄)은 --env=<파일>로 읽거나 --stdin으로 표준 입력에서 읽음(1.x의 파일은 root 소유이고 비밀 저장소는 서비스 계정 소유이므로 설치 프로그램이 파일을 열어 파이프로 넘김). 둘 중 정확히 하나를 지정함. 이미 있는 비밀은 그대로 두고 바꾸지 않으며, 값은 출력하지 않고 비밀의 이름만 출력함
secret-import-1x.stored=비밀 {0}을(를) 1.x 설정 {1}에서 가져와 저장했습니다.
secret-import-1x.kept=비밀 {0}이(가) 이미 있어 그대로 두었습니다.
error.HOST_FAILED=호스트를 준비하지 못했습니다({0}, {1}). Linux에서는 root로, Windows에서는 관리자 권한 프롬프트에서 실행해야 하며, Linux에서는 서비스 사용자가 있어야 합니다. 그 전까지 한 일은 완결되어 있으며 원인을 고친 뒤 다시 실행하면 됩니다.
error.HOST_UNSUPPORTED=이 명령에는 속성 뷰 {0}을(를) 지원하는 파일 시스템 또는 Windows 인스턴스(--platform=windows)가 필요합니다. 아무것도 바꾸지 않았습니다.
usage.prepare-host=prepare-host --jars=<디렉터리> --driver-jar=<파일> [--winsw=<파일>] --java=<경로> --jdbc-url=<url> --app-account=<계정> [--name=<이름>] [--platform=<플랫폼>] [--home=<경로>] [--schema=<이름>] [--long-text-type=<형>] [--mcp-port=<n>] [--admin-port=<n>] [--mcp-host=<호스트> --admin-host=<호스트>] [--nginx-conf=<경로> --tls-certificate=<경로> --tls-key=<경로>] [--root=<디렉터리>]   설치를 위한 호스트 파일 준비(root로, Windows에서는 관리자 권한 프롬프트에서 실행). 운영체제 명령 대신 디렉터리를 소유자·모드와 함께 만들고(Linux: 서비스 사용자가 설정·비밀 디렉터리를 소유) 또는 홈을 SYSTEM과 Administrators 외 모든 계정에게 닫고 이전 실행의 비밀을 설치 계정에게 되돌리며(Windows), 디렉터리의 jar 3개와 JDBC 드라이버 jar를 복사하고(Windows는 WinSW 실행 파일도 --winsw로 서비스마다 한 번씩), render-deploy처럼 파일을 렌더링함. 렌더링한 파일이 대체하는 1.x의 파일은 <file>.1x-backup으로 보관함. 모든 옵션은 변경 전에 검증함
prepare-host.prepared=인스턴스 {0}의 호스트를 준비했습니다.
usage.seal-host=seal-host --java=<경로> --jdbc-url=<url> --app-account=<계정> [--name=<이름>] [--platform=<플랫폼>] [--home=<경로>] [--schema=<이름>] [--long-text-type=<형>] [--mcp-port=<n>] [--admin-port=<n>] [--mcp-host=<호스트> --admin-host=<호스트>] [--nginx-conf=<경로> --tls-certificate=<경로> --tls-key=<경로>] [--root=<디렉터리>]   Windows에서 비밀을 저장하고 서비스를 등록한 뒤 실행: 하나뿐인 서비스 계정(LocalService)에 jar·설정·로그에 필요한 접근을 주고, 비밀을 그 계정에 넘기며(파일을 먼저, 그다음 폴더. Administrators는 파일이 있는지만 볼 수 있고 그 외에는 접근 없음) 폴더의 ACL을 마무리함. Linux 인스턴스는 거부함
seal-host.sealed=인스턴스 {0}의 비밀을 서비스 계정에 넘기고 폴더의 접근 권한을 설정했습니다.
