# Command line tool: no web server and no port; Boot internals stay quiet so only the command output is shown.
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false
spring.messages.basename=messages
# The default bundle (English) is the fallback of every locale without a bundle of its own; the locale of the machine is not a second fallback.
spring.messages.fallback-to-system-locale=false
# The installation the tool works for: ledger.secrets.home holds the settings, the driver registration, the driver jars and the
# secret directory; /etc/<instance> unless ledger.secrets.home is given (the Windows installation gives its own directory,
# see deploy/install.cmd). Both services and the owner commands share one instance.
ledger.secrets.instance=pg-ledger-mcp
ledger.secrets.home=/etc/${ledger.secrets.instance}
ledger.secrets.directory=${ledger.secrets.home}/secrets
# The settings of the ledger database come from the same places as in the server applications, through spring.config.import:
# the settings file that render-deploy writes (application.yaml: the JDBC URL and the account of the application) and the
# operator's own (local.yaml), the registration of the JDBC driver (ledger.jdbc.driver.*, written by driver-register) and the
# secret store as a configtree (ledger.jdbc.password and the other secrets; ledger.jdbc.url and ledger.jdbc.username are
# ordinary settings). All are optional: a machine without a driver or without secrets still runs secret-set and
# driver-register. The placeholders carry the defaults of the properties above, so the import does not depend on this file's
# own properties being visible to it; a value given on the command line (--ledger.secrets.home=...) always wins. A service
# imports the same four sources plus the settings file of its own (mcp.yaml, admin.yaml).
spring.config.import=optional:file:${ledger.secrets.home:/etc/${ledger.secrets.instance:pg-ledger-mcp}}/application.yaml,optional:file:${ledger.secrets.home:/etc/${ledger.secrets.instance:pg-ledger-mcp}}/local.yaml,optional:file:${ledger.secrets.home:/etc/${ledger.secrets.instance:pg-ledger-mcp}}/jdbc-driver.yaml,optional:configtree:${ledger.secrets.directory:${ledger.secrets.home:/etc/${ledger.secrets.instance:pg-ledger-mcp}}/secrets}/
# driver-register: the registration file (read back through spring.config.import above) and the one directory a driver jar
# is taken from; both follow ledger.secrets.home and can be overridden on the command line.
ledger.cli.driver.file=${ledger.secrets.home}/jdbc-driver.yaml
ledger.cli.driver.directory=${ledger.secrets.home}/drivers
# The operator tool: this switches on the services that only an operator command uses (the legacy import); the MCP server and the admin web never set it.
ledger.cli.enabled=true
