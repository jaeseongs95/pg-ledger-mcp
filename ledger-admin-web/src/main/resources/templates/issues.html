<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments :: head(#{issues.title})}"></head>
<body>
<th:block th:replace="~{fragments :: header('issues')}"></th:block>
<main id="main" class="record-page">
  <div class="page-header">
    <div class="page-header-text">
      <h1 th:text="#{issues.title}">Issues</h1>
    </div>
  </div>

  <div th:if="${choice.selected() == null}" class="empty-state">
    <p class="empty-state-title" th:text="#{common.noProject}">Add a project first.</p>
    <a class="button secondary btn-sm" th:href="@{/projects}" th:text="#{nav.projects}">Projects</a>
  </div>

  <th:block th:if="${choice.selected() != null}">
    <form method="get" th:action="@{/issues}" class="filters list-filters issues-filters">
      <div class="filter-grid">
        <div class="filter-field">
          <label for="project" th:text="#{common.project}">Project</label>
          <select id="project" name="project" data-version-source>
            <option th:unless="${choice.listed()}" th:value="${choice.selected()}"
                    th:text="${choice.selected()}" selected>Project</option>
            <option th:each="p : ${choice.projects()}" th:value="${p.id()}" th:selected="${p.id() == choice.selected()}"
                    th:text="${p.displayName()}">Project</option>
          </select>
        </div>
        <div th:replace="~{fragments :: versionFilter(${choice.selected()}, ${filter.projectVersion()})}"></div>
        <div class="filter-field">
          <label for="status" th:text="#{common.status}">Status</label>
          <select id="status" name="status">
            <option value="" th:text="#{common.any}">Any</option>
            <option th:each="s : ${statuses}" th:value="${s.token()}" th:text="${@labels.issueStatus(s.token())}" th:selected="${s.token() == filter.status()}">Open</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="severity" th:text="#{common.severity}">Severity</label>
          <select id="severity" name="severity">
            <option value="" th:text="#{common.any}">Any</option>
            <option th:each="c : ${severities}" th:value="${c.code()}" th:text="${@labels.code(c)}" th:selected="${c.code() == filter.severity()}">P1</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="category" th:text="#{common.category}">Category</label>
          <select id="category" name="category">
            <option value="" th:text="#{common.any}">Any</option>
            <option th:each="c : ${categories}" th:value="${c.code()}" th:text="${@labels.code(c)}" th:selected="${c.code() == filter.category()}">ARC</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="attention" th:text="#{common.attention}">Attention</label>
          <select id="attention" name="attention">
            <option value="" th:text="#{common.any}">Any</option>
            <option th:each="a : ${attentions}" th:value="${a}" th:text="#{'attention.' + ${a}}" th:selected="${#strings.toString(a) == filter.attention()}">kind</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="taskId" th:text="#{issues.taskId}">Task ID</label>
          <input id="taskId" name="taskId" type="text" th:value="${filter.taskId()}" th:placeholder="#{issues.taskId.placeholder}" maxlength="200">
        </div>
        <div class="filter-field">
          <label for="owner" th:text="#{common.owner}">Owner</label>
          <input id="owner" name="owner" type="text" th:value="${filter.owner()}" maxlength="200">
        </div>
        <div class="filter-field filter-field-sm">
          <label for="limit" th:text="#{paging.size}">Rows per page</label>
          <select id="limit" name="limit">
            <option th:each="n : ${sizes}" th:value="${n}" th:text="${n}" th:selected="${n == paging.limit()}">50</option>
          </select>
        </div>
      </div>
      <div class="filter-controls">
        <th:block th:replace="~{fragments :: dateFilters(false)}"></th:block>
        <div class="filter-actions">
          <button type="submit" th:text="#{common.apply}">Apply</button>
          <a th:if="${hasFilters}" th:href="${resetHref}" class="button secondary" th:text="#{common.resetFilters}">Reset filters</a>
        </div>
      </div>
    </form>

    <p th:replace="~{fragments :: listTotals(${page})}"></p>
    <div th:if="${!#lists.isEmpty(page.items())}" class="table-wrap results-table" role="region" tabindex="0" th:attr="aria-label=#{issues.title}">
      <table class="issues-table">
        <caption class="sr-only" th:text="#{issues.title}">Issues</caption>
        <thead>
          <tr>
            <th scope="col" th:text="#{col.id}">ID</th>
            <th scope="col" th:text="#{col.title}">Title</th>
            <th scope="col" class="version-col" th:text="#{versions.column}">Version</th>
            <th scope="col" th:text="#{common.status}">Status</th>
            <th scope="col" th:text="#{common.severity}">Severity</th>
            <th scope="col" th:text="#{common.category}">Category</th>
            <th scope="col" th:text="#{common.owner}">Owner</th>
            <th th:replace="~{fragments :: dateHeader(#{col.created}, ${createdSort})}">Registered</th>
            <th th:replace="~{fragments :: dateHeader(#{col.updated}, ${updatedSort})}">Last modified</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="i : ${page.items()}">
            <td class="cell-id"><a th:href="@{/issues/{id}(id=${i.id()})}" th:text="${i.id()}">ID</a></td>
            <td class="cell-title" th:text="${i.title()}">Title</td>
            <td th:replace="~{fragments :: versionCell(${i.projectVersions()}, '/issues', ${choice.selected()})}"></td>
            <td class="cell-nowrap"><span th:class="'badge badge-' + ${i.status()}" th:text="${@labels.issueStatus(i.status())}">Open</span></td>
            <td class="cell-nowrap"><span th:class="'badge badge-' + ${i.severity()}" th:attr="title=${i.severity()}" th:text="${@labels.codeName('ISSUE_SEVERITY', i.severity())}">P1</span></td>
            <td class="cell-nowrap" th:attr="title=${i.category()}" th:text="${@labels.codeName('ISSUE_CATEGORY', i.category())}">ARC</td>
            <td class="cell-owner" th:text="${i.owner() != null} ? ${i.owner()} : #{common.noneValue}">owner</td>
            <td th:replace="~{fragments :: dateCell(${i.createdAt()})}">t</td>
            <td th:replace="~{fragments :: dateCell(${i.updatedAt()})}">t</td>
          </tr>
        </tbody>
      </table>
    </div>
    <th:block th:if="${#lists.isEmpty(page.items())}"><th:block th:replace="~{fragments :: emptyState(${hasFilters}, ${resetHref})}"></th:block></th:block>
    <nav th:replace="~{fragments :: pager(${paging})}"></nav>
  </th:block>
</main>
<th:block th:replace="~{fragments :: footer}"></th:block>
</body>
</html>
