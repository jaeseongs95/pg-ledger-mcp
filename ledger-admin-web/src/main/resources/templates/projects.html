<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments :: head(#{projects.title})}"></head>
<body>
<th:block th:replace="~{fragments :: header('projects')}"></th:block>
<main id="main">
  <h1 th:text="#{projects.title}">Projects</h1>
  <table th:if="${!#lists.isEmpty(projects)}">
    <caption class="sr-only" th:text="#{projects.title}">Projects</caption>
    <thead><tr><th scope="col" th:text="#{col.id}">ID</th><th scope="col" th:text="#{projects.code}">Code</th><th scope="col" th:text="#{projects.titleCol}">Title</th></tr></thead>
    <tbody><tr th:each="p : ${projects}"><td th:text="${p.id()}">p1</td><td th:text="${p.code()}">P1</td><td th:text="${p.title()}">Title</td></tr></tbody>
  </table>
  <p th:if="${#lists.isEmpty(projects)}" th:text="#{projects.none}">No project yet.</p>

  <section>
    <h2 th:text="#{projects.add}">Add a project</h2>
    <form method="post" th:action="@{/projects}">
      <label for="id" th:text="#{projects.id.label}">Project id</label>
      <input id="id" name="id" type="text" required autocomplete="off">
      <label for="code" th:text="#{projects.code.label}">Code (upper case, the prefix of defect and task ids)</label>
      <input id="code" name="code" type="text" required autocomplete="off">
      <label for="title" th:text="#{projects.title.label}">Title</label>
      <input id="title" name="title" type="text" required maxlength="200" autocomplete="off">
      <button type="submit" th:text="#{projects.submit}">Add</button>
    </form>
  </section>
</main>
<th:block th:replace="~{fragments :: footer}"></th:block>
</body>
</html>
