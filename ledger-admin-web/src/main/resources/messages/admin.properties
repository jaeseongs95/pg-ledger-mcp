grants.scope.help.issue_create=Register new issues in this project. Use Edit issues to change existing records or add observations.
grants.scope.help.issue_update=Edit existing issues, change author states, record observations, and manage issue–task links or relations between issues. Merge and cross-project links also require access in the related project.
grants.scope.help.spec_create=Register new specifications in this project. Use Edit specifications to change existing specifications and their links.
grants.scope.help.spec_update=Edit specifications, change author states, and manage specification links to issues or tasks. Moving a specification requires this permission in both projects.
grants.scope.help.task_create=Register new tasks in this project. Use Edit tasks to change existing tasks.
grants.scope.help.task_update=Edit existing tasks, change author states, and manage version links. The author can withdraw a completion report. An independent return for rework uses Verify.
grants.scope.help.criterion_create=Register new criteria in a release milestone. An independent reviewer uses Verify to decide if a criterion is met.
grants.scope.help.criterion_update=Edit existing criteria, change author states, and manage links to issues, specifications, tasks, or versions. Use Verify for an independent verdict.
grants.scope.help.deliverable_create=Record a new deliverable on an issue, specification, or task. The entry can also report resolution or completion for eligible records.
grants.scope.help.deliverable_update=Amend the check reference, result, or time of an existing deliverable. Report completion through the record’s author transition or by recording a new deliverable.
grants.scope.help.version_create=Register a new project version. Associating existing records with it requires the corresponding record edit permissions.
grants.scope.help.version_update=Rename a project version or edit its description. Linking or unlinking existing records requires the corresponding record edit permissions.
grants.scope.help.verify=With evidence, verify reports, decide release criteria, return a resolved issue to Open or a completed specification, task, or criterion to Active, or withdraw a prior verdict. Independent decisions require a session that did not contribute to the reported work.
