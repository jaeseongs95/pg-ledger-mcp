# 한국어 MCP 도구·파라미터 설명 번들 (도메인 중립 2.0 범용 장부 계약)

catalog.empty=활성 상태인 {0} 공통 코드가 아직 없습니다. 다음 명령으로 추가하세요: ledger-cli code-set {0} CODE NAME

# ---------------------------------------------------------------- 쓰기 도구 (13)
tool.ledger_issue_save=이슈를 등록하거나 편집합니다. 등록에는 project_id, title, symptom, root_cause와 활성 분류·심각도가 필요합니다. id를 생략하면 자동 부여합니다. 편집에는 id, 현재 expected_version이 필요하며 프로젝트는 고정됩니다. VERIFIED는 재개방 후 편집합니다. 생성에는 issue_create, 수정에는 issue_update 권한이 필요합니다.
tool.ledger_spec_save=명세를 PLANNED로 등록하거나 편집합니다. 등록에는 project_id와 title을, 편집에는 id와 현재 expected_version을 지정하세요. VERIFIED는 먼저 재개방합니다. 작성에는 spec_create, 수정에는 spec_update 권한이 필요합니다. 프로젝트를 옮기면 두 프로젝트의 spec_update가 필요합니다.
tool.ledger_task_save=작업을 PLANNED로 등록하거나 편집합니다. 등록에는 project_id와 title을, 편집에는 id와 현재 expected_version을 지정하세요. VERIFIED는 먼저 재개방합니다. 생성에는 task_create, 수정에는 task_update 권한이 필요합니다. 프로젝트를 옮기면 두 프로젝트의 task_update가 필요합니다.
tool.ledger_criterion_save=출시 기준을 UNKNOWN으로 등록하거나 편집합니다. 등록에는 id, project_id, milestone_name, code, criterion_text가 필요합니다. 편집에는 현재 expected_version이 필요합니다. MET·NOT_MET는 먼저 재개방합니다. 생성에는 criterion_create, 수정에는 criterion_update 권한이 필요합니다. 프로젝트를 옮기면 두 프로젝트의 criterion_update가 필요합니다.
tool.ledger_transition=작성자 상태를 전이합니다. 이슈 RESOLVED에는 산출물, NOT_AN_ISSUE·DISPUTED 및 명세·작업·기준 COMPLETED에는 evidence_uri, MERGED에는 merged_into가 필요합니다. 독립 검수와 재개방은 ledger_review를 사용하세요. 대상의 *_update 권한이 필요하며, 이슈 병합에는 양쪽에 issue_update 권한이 필요합니다.
tool.ledger_record_deliverable=산출물을 기록하거나 점검 정보를 갱신합니다. 새 산출물의 작성자는 대상의 담당자가 됩니다. mark_done은 기본 true로, 열린 이슈를 해결하거나 완료 가능한 명세·작업을 완료합니다. 중간 기록에는 false를 지정하세요. 등록에는 deliverable_create, 갱신에는 deliverable_update 권한이 필요합니다. 독립 검수는 ledger_review를 사용하세요.
tool.ledger_record_case=이슈에 관측 사례 1건을 추가합니다. MERGED 이슈는 병합 대상에 기록하세요. 여러 건은 ledger_batch의 op=record_case를 사용하세요. issue_update 권한이 필요합니다.
tool.ledger_link=두 장부 항목을 연결하거나 remove=true로 해제합니다. 방향성 관계(caused_by는 b가 a의 원인, blocks는 a가 b를 차단)에서 (a, b)와 (b, a)는 서로 다른 관계입니다. 해제할 때도 순서를 유지하세요. 방향성 없는 이슈 관계는 어느 순서든 같은 관계입니다. 프로젝트 버전 연결은 ledger_batch의 op=project_version을 사용하세요.
tool.ledger_correct=작성자 이력에 오류 표시를 남기는 정정 이력을 추가합니다. 장부 데이터를 바꾸려면 해당 쓰기 작업을 사용하세요. 검수 이력 정정은 ledger_review_correct를 사용합니다.
tool.ledger_batch=작성자 작업 1..200개를 한 번에 모두 반영하거나 취소합니다. operationKey 하나와 선택 항목 default_reason을 공유합니다. project_version으로 버전과 기존 항목을 관리합니다. save에 project_version을 지정하면 항목을 생성하고 연결합니다. 실행 실패 시 op_index와 op를 반환합니다. 독립 검수는 ledger_review를 사용하세요.
tool.ledger_review=독립 검수자가 evidence_uri를 첨부해 검증하거나 재개방합니다. 산출물이 있는 RESOLVED 이슈와 COMPLETED 명세·작업을 검증하고, 출시 기준은 MET·NOT_MET로 판정합니다. 작업에 참여한 세션은 검수할 수 없습니다(SAME_SESSION). 실제 산출물을 확인하세요. 자동 점검은 선택 정보입니다. 재작업은 ledger_issue의 resolved_by 또는 ledger_spec·ledger_task의 completed_by에 요청하세요. 같은 MCP 연결에서 대상 프로젝트의 verify 권한이 필요합니다.
tool.ledger_review_correct=검수 이력에 오류 표시를 남깁니다. 상태를 변경하려면 ledger_review를 사용하세요. 같은 MCP 연결에서 대상 프로젝트의 verify 권한이 필요합니다.
tool.ledger_whoami=현재 세션 ID, 활성 프로젝트 권한과 can_verify_login을 조회합니다. 세션이나 권한을 확인해야 할 때 호출하세요. 검수도 같은 MCP 연결에서 수행합니다.

# ---------------------------------------------------------------- 첨부 도구 (5)
tool.artifact_begin=첨부 파일 1..64개의 업로드를 시작합니다. 호출자가 operationKey를 정하고 같은 파일을 재시도할 때 재사용하세요. 각 uploadId로 artifact_chunk를 호출한 뒤 번들 attachmentId로 artifact_finish를 호출하세요. 기본 파일 한도는 64 MiB입니다. 활성 권한이 필요합니다.
tool.artifact_chunk=sequence 0부터 원본 최대 262144바이트를 base64(최대 349528자)와 SHA-256으로 보냅니다. 같은 uploadId, sequence, chunkSha256으로 재시도하면 현재 수신 상태를 받습니다. ARTIFACT_BUSY면 같은 청크를 나중에 보내고, 재개 위치는 artifact_status로 확인하세요.
tool.artifact_finish=크기와 해시를 확인하고 attachmentId로 번들을 확정합니다. 재시도에는 같은 attachmentId를 사용하세요. ARTIFACT_INCOMPLETE면 artifact_status와 artifact_chunk로 이어서 전송합니다. ARTIFACT_HASH_MISMATCH가 나면 만료까지 전송 바이트를 보관합니다. 확정 ID는 지원되는 장부 쓰기의 attachment_id로 전달하세요. 활성 권한이 필요합니다.
tool.artifact_status=파일 전송은 uploadId로, 확정 번들은 attachmentId로 확인합니다. 둘 중 하나를 지정하세요. received와 sequence로 artifact_chunk를 재개합니다.
tool.artifact_read=확정 파일의 지정 구간을 읽고 무결성을 검사합니다. 원문이 필요하면 fields에서 text, size, totalBytes를 선택해 base64를 생략하세요. 필요한 범위만 요청하세요. 활성 권한이 필요합니다.

# ---------------------------------------------------------------- 읽기 도구 (15)
tool.ledger_get=쓰기 전에 알고 있는 ID 최대 200개의 상태와 행 버전을 조회합니다. 최대 10개는 include_details=true로 상세와 연결된 project_versions도 받습니다. 찾지 못한 ID는 not_found로 반환합니다. ID를 찾으려면 ledger_search를 사용하세요.
tool.ledger_issue=이슈 하나의 상세, 사례, 연결 항목, 최근 변경 이력, 관련 버전을 조회합니다. 여러 ID는 ledger_get에 include_details=true를 지정하세요.
tool.ledger_spec=명세 하나의 내용, 연결 항목, 산출물과 변경 이력을 조회합니다. 여러 ID는 ledger_get에 include_details=true를 지정하세요.
tool.ledger_task=작업 하나의 목적, 완료 조건, 산출물과 연결 항목을 조회합니다. 여러 ID는 ledger_get의 include_details=true, 변경 이력은 ledger_history를 사용하세요.
tool.ledger_criterion=기준 하나의 본문, 상태, 연결 항목과 변경 이력을 조회합니다. 여러 ID는 ledger_get에 include_details=true를 지정하세요.
tool.ledger_history=이력 ID, 대상, 프로젝트, 작업, 작성자, 시간으로 감사 이력을 조회합니다. 이전 값이 필요하면 include_before를 지정하세요.
tool.ledger_search=키워드나 등록된 프로젝트 버전으로 이슈·명세·작업·출시 기준 ID를 찾습니다. project와 project_version을 지정하면 키워드를 생략할 수 있습니다. 출시 기준은 이 검색에 생성 시각이 없어 날짜 범위를 지정하면 제외됩니다. 상세는 ledger_get을 사용하세요.
tool.ledger_issues=프로젝트 이슈와 관련 버전을 조회합니다. 상태, 심각도, 분류, 주의 항목, 담당자, project_version으로 거릅니다.
tool.ledger_specs=프로젝트의 명세 목록을 조회합니다. 상태, 상위 명세, 우선순위, 담당자, 주의 항목, project_version으로 거릅니다.
tool.ledger_tasks=프로젝트의 작업 목록을 조회합니다. 상태, 담당자, 주의 항목, project_version으로 거릅니다.
tool.ledger_criteria=프로젝트의 출시 기준 목록을 조회합니다. 상태, 마일스톤, project_version으로 거릅니다.
tool.ledger_attention=조치 대상 이슈·명세·작업을 찾습니다. 제목·담당·수정 시각이 필요하면 include_context=true를 지정하세요.
tool.ledger_stats=프로젝트별 또는 전체의 이슈·명세·작업·기준 상태별 집계를 반환합니다. bucket = day 지정 시 UTC 일자별 신규 생성 건수를 함께 반환합니다.
tool.ledger_projects=프로젝트 ID나 display_name으로 프로젝트를 찾습니다. 반환된 id는 project 또는 project_id, code는 항목 ID 접두사로 사용합니다. 등록 버전은 include_versions=true로 조회합니다.
tool.ledger_codes=그룹별 공통 코드를 조회합니다. 필요한 명칭·설명·방향 필드를 선택하고 폐기 코드가 필요할 때 include_inactive를 지정하세요.

# ---------------------------------------------------------------- 파라미터
param.host_attestation=클라이언트 훅이 자동으로 채우는 호스트 세션 작성자 식별자(<벤더>:<세션ID>)입니다(수동 입력 금지).
param.artifact_operation_key=필수. 번들 업로드 시작의 멱등성 키(1..128자, 예: UUID)입니다.
param.artifact_files=필수. 번들에 포함할 1..64개 파일 선언 목록입니다.
param.artifact_file_name=파일 이름(1..512자, 백슬래시 및 제어문자 금지)입니다.
param.artifact_media_type=type/subtype 형식의 미디어 타입입니다.
param.artifact_size=파일의 정확한 바이트 크기입니다.
param.artifact_sha256=전체 파일의 64자 소문자 16진수 SHA-256 해시입니다.
param.artifact_purpose=선택 목적 값(기본값이자 유일한 지원값은 evidence)입니다.
param.artifact_upload_id=artifact_begin이 반환한 파일별 uploadId입니다.
param.artifact_sequence=0부터 시작하는 청크 순번입니다.
param.artifact_data=Base64 인코딩된 청크 데이터(원본 최대 262144바이트, 349528자)입니다.
param.artifact_chunk_sha256=해당 청크 원본 바이트의 64자 소문자 16진수 SHA-256 해시입니다.
param.artifact_status_upload_id=조회할 진행 중 업로드 ID(uploadId와 attachmentId 중 하나만 지정)입니다.
param.artifact_status_attachment_id=조회할 확정 첨부 번들 ID(uploadId와 attachmentId 중 하나만 지정)입니다.
param.artifact_attachment_id=첨부 번들 ID입니다.
param.artifact_seq=번들 내 0-기반 파일 순번(생략 시 0)입니다.
param.artifact_offset_bytes=읽기 시작 바이트 오프셋입니다.
param.artifact_max_bytes=읽을 최대 바이트 수(1..262144)입니다.
param.operation_key=필수. 호출자가 직접 지정하는 쓰기 멱등성 키(1..128자, 예: UUID)입니다. 같은 키와 같은 인자로 재호출하면 저장된 응답을 재생합니다.
param.batch_operation_key=필수. 배치 전체에 대한 멱등성 키(1..128자, 예: UUID)입니다. 개별 연산 항목에는 키를 넣지 않습니다.
param.batch_default_reason=각 작업에 별도의 사유가 없을 때 사용하는 공통 사유입니다.
param.whoami_project=이 프로젝트 ID의 권한만 반환합니다. 로그인 가능 여부는 세션 전체 기준입니다.
param.include_attention_context=목록에 제목, 실제 담당, 마지막 수정 시각을 함께 반환합니다.
param.reason=감사 이력에 남길 변경 사유(10..1000자)입니다.
param.case_reason=관측 사례를 기록하는 사유(10..1000자)입니다.
param.correct_reason=대상 이력이 잘못된 이유(10..1000자)입니다.
param.entity=대상 엔티티 종류(issue, spec, task, criterion)입니다.
param.review_entity=검수 또는 재개방할 엔티티 종류(issue, spec, task, criterion)입니다.
param.id=대상 행 ID입니다.
param.issue_save_id=이슈 ID. 생성 시 생략하면 <PROJECT_CODE>-I-NNNN으로 자동 채번합니다. 편집에는 가져온 -D- ID를 포함해 실제 ID를 지정하세요.
param.spec_save_id=명세 ID. 공백·제어 문자 없이 1..120자입니다. 생성 시 생략하면 <PROJECT_CODE>-S-NNNN으로 자동 채번합니다. 편집 시 필수입니다.
param.task_save_id=작업 ID. 공백·제어 문자 없이 1..120자입니다. 생성 시 생략하면 <PROJECT_CODE>-T-NNNN으로 자동 채번합니다. 편집 시 필수입니다.
param.criterion_save_id=출시 기준 ID. 공백·제어 문자 없이 1..120자이며 생성과 편집 모두 필수입니다(예: PROJ-C-M1-01).
param.expected_version=낙관적 잠금용 현재 행 버전입니다.
param.save_expected_version=생성 시 0 또는 생략, 편집 시 현재 행의 양수 버전입니다.
param.transition_to=전이할 작성자 채널 목표 상태입니다(VERIFIED, MET, NOT_MET은 ledger_review 사용).
param.review_to=검수 목표 상태(VERIFIED, MET, NOT_MET) 또는 재개방할 상태입니다.
param.evidence_uri=근거 자료 URI 또는 참조 식별자(1..2000자)입니다.
param.review_evidence_uri=필수. 독립 검수자가 직접 확인한 검증 근거 URI 또는 참조(1..2000자)입니다.
param.evidence_sha256=근거 파일의 선택적 64자 소문자 16진수 SHA-256 해시입니다.
param.merged_into=MERGED 전이 시 병합 대상 이슈 ID입니다.
param.issue_id=이슈 ID입니다.
param.spec_id=명세 ID입니다.
param.task_id=작업 ID입니다.
param.criterion_id=마일스톤 기준 ID입니다.
param.target_entity=산출물이 속한 대상 엔티티 종류(issue, spec, task)입니다.
param.target_id=대상 이슈, 명세 또는 작업 ID입니다.
param.deliverable_kind=산출물 분류 코드(DELIVERABLE_KIND 활성 코드)입니다.
param.deliverable_ref=산출물의 불변 식별자나 판본 참조(1..300자)입니다.
param.deliverable_location=산출물이 위치한 저장소·보관소·경로 참조(최대 300자, 선택)입니다.
param.deliverable_summary=산출물 핵심 내용 요약(1..1000자, 필수)입니다.
param.check_ref=점검 보고서의 참조나 URL입니다. check_result를 지정하거나 기존 산출물의 점검 정보를 갱신할 때 필수입니다.
param.check_result=점검 결과 메타데이터(passed, failed, cancelled)입니다.
param.checked_at=점검 완료 시각(UTC ISO-8601, 선택)입니다.
param.mark_done=등록과 갱신 모두 기본값은 true입니다. OPEN 이슈를 RESOLVED로, DRAFT/PLANNED/ACTIVE/BLOCKED 명세와 PLANNED/ACTIVE/BLOCKED 작업을 COMPLETED로 전이합니다. 상태를 유지하려면 false를 지정하세요.
param.observation=관측된 현상 설명(1..4000자)입니다.
param.case_evidence=관측 근거 위치(로그, 타임코드, 쪽·절, 파일:줄, URI 등 최대 2000자)입니다.
param.source_quote=제보자·원문 인용문(최대 2000자, 선택)입니다.
param.observed_at=관측 시각(UTC ISO-8601, 선택)입니다.
param.kind=연결 이름의 유형 순서로 a와 b를 지정합니다(예: issue_task는 이슈 a, 작업 b). 두 대상 프로젝트에 같은 권한이 필요합니다. issue_task와 이슈 간 관계에는 issue_update, issue_spec과 spec_task에는 spec_update, 기준 연결에는 criterion_update가 필요합니다.
param.link_a=첫 번째 ID입니다. 방향성 관계에서는 주어(caused_by의 결과 이슈, blocks의 차단 주체)입니다.
param.link_b=두 번째 ID입니다. 방향성 관계에서는 목적어(caused_by의 원인 이슈, blocks의 피차단 이슈)입니다.
param.remove=true이면 연결을 해제합니다(기본값 false).
param.history_id=정정 표시할 이력 ID입니다.
param.ops=순서대로 실행할 작업 1~200개입니다. project_version에 project_id와 name을 지정합니다. 등록(create=true)은 version_create, 이름 변경(original_name)·설명 수정(description)은 version_update 권한이 필요합니다. 같은 프로젝트의 기존 항목 연결·해제는 link_items·unlink_items에 유형별 ID를 각각 최대 200개 지정합니다(예: {"spec":["STUDIO-S-0001"]}). 연결·해제에는 대상 유형의 *_update 권한이 필요합니다. 기존 link_issue_ids·unlink_issue_ids도 지원합니다.
param.attachment_id=이력에 연결할 본인 소유의 확정 첨부 번들 UUID(artifact_finish 반환값, 선택)입니다.

param.ids=조회할 1..200개 엔티티 ID 목록입니다.
param.include_details=최대 10개 ID의 이슈·명세·작업·기준 상세를 종류별 필드로 함께 반환합니다.
param.result_fields=선택한 data 경로만 반환합니다(예: items.id). 페이지 정보는 유지합니다.
param.structured_only=structuredContent를 읽는 클라이언트에서 중복 텍스트를 생략합니다.
param.project_version=project에 등록된 정확한 버전명입니다. 해당 버전에 연결된 항목을 반환합니다. 등록 버전명은 ledger_projects(include_versions=true)로 조회합니다.
param.project_display_name=표시명에 포함된 문구를 검색합니다. 대소문자를 구분하지 않으며 최대 200자입니다.
param.include_project_versions=이 페이지에 표시되는 프로젝트의 등록된 버전명과 설명을 함께 반환합니다.
param.project=ledger_projects가 반환하는 고정 id입니다(예: my_project).
param.max_rows=페이지당 최대 행 수(1..1000, 기본값 50)입니다.
param.cursor=이전 페이지 응답의 next_cursor 토큰입니다.
param.history_ids=조회할 이력 ID 목록(1..200개)입니다.
param.id_from=최소 이력 ID(포함)입니다.
param.id_to=최대 이력 ID(포함)입니다.
param.history_entity=이력 엔티티 종류 필터입니다.
param.entity_id=대상 엔티티 ID 필터입니다.
param.op=가져온 기록의 작업 유형을 포함한 이력 작업 필터입니다.
param.history_author_id=이력 작성자 ID 필터입니다.
param.at_from=조회 시작 시각(UTC ISO-8601, 포함)입니다.
param.at_to=조회 종료 시각(UTC ISO-8601, 포함)입니다.
param.include_before=true이면 변경 전 전체 스냅샷(before_data)을 함께 반환합니다.
param.search_kinds=검색 대상 종류(issue, spec, task, criterion; 기본값 전체)입니다.
param.keywords=1..20개의 리터럴 검색 키워드(각 1..200자)입니다. project와 project_version을 지정한 경우 생략하면 연결된 항목을 조회합니다.
param.match=키워드 일치 방식(ANY: 하나 이상 일치 기본값, ALL: 모두 일치)입니다.
param.exclude_status=검색 결과에서 제외할 상태 목록입니다.
param.created_from=생성 시작 시각(UTC ISO-8601, 포함)입니다. 기준은 생성 시각이 없으므로 범위를 주면 빠집니다.
param.created_to=생성 종료 시각(UTC ISO-8601, 포함)입니다. 기준은 생성 시각이 없으므로 범위를 주면 빠집니다.
param.issue_status=이슈 상태 필터입니다.
param.spec_status=명세 상태 필터입니다.
param.parent_spec_id=상위 명세 ID 필터입니다.
param.priority_filter=명세 우선순위 필터입니다.
param.severity=이슈 심각도 코드 필터입니다.
param.category=이슈 분류 코드 필터입니다.
param.attention_kind=주의 항목 종류 필터입니다.
param.attention_filter=특정 주의 항목 종류만 조회합니다.
param.owner=담당자 작성자 ID 필터입니다.
param.task_state=작업 상태 필터입니다.
param.criterion_state=마일스톤 기준 상태 필터입니다.
param.milestone_name=마일스톤명 필터입니다.
param.bucket=day 지정 시 UTC 일자별 신규 생성 건수를 포함합니다.
param.code_group=공통 코드 그룹 필터입니다.
param.include_inactive=true이면 비활성(폐기) 코드도 함께 조회합니다.

# ---------------------------------------------------------------- 엔티티 필드
field.project_id=소유 프로젝트 ID(생성 시 필수; 이슈 편집 시 변경 불가; 명세·작업·기준 편집 시 프로젝트 이동)입니다.
field.parent_id=같은 프로젝트 내 상위 명세 ID(편집 시 빈 문자열이면 해제)입니다.
field.title=제목(1..500자; 이슈·명세·작업 생성 시 필수)입니다.
field.category=이슈 분류 코드(ISSUE_CATEGORY 활성 코드)입니다.
field.severity=이슈 심각도 코드(ISSUE_SEVERITY 활성 코드: P1, P2, P3)입니다.
field.symptom=관측된 증상 또는 문제 현상(최대 20000자; 이슈 생성 시 필수, 빈 문자열 허용)입니다.
field.root_cause=확인되었거나 추정되는 근본 원인(최대 20000자; 이슈 생성 시 필수, 빈 문자열 허용)입니다.
field.summary=명세 요약 및 범위 설명(최대 20000자; 편집 시 빈 문자열이면 비움)입니다.
field.acceptance_criteria=검증 가능한 명세 완료·수용 기준(최대 20000자; 편집 시 빈 문자열이면 비움)입니다.
field.priority=명세 우선순위 라벨(1..64자; 편집 시 빈 문자열이면 비움)입니다.
field.owner_actor_id=담당 작성자 ID(편집 시 빈 문자열이면 담당자 해제)입니다.
field.purpose=작업의 목적과 배경(최대 20000자; 편집 시 빈 문자열이면 비움)입니다.
field.success_condition=작업 완료 판정 조건(최대 20000자; 편집 시 빈 문자열이면 비움)입니다.
field.origin_ref=원천 요청·문서·장면 참조(최대 500자; 편집 시 빈 문자열이면 비움)입니다.
field.origin_quote=원천 요청 원문 인용(최대 4000자; 편집 시 빈 문자열이면 비움)입니다.
field.milestone_name=마일스톤·출시·발간 단계 이름(1..120자; 기준 생성 시 필수)입니다.
field.goal_label=마일스톤 내 상위 목표 라벨(최대 200자; 편집 시 빈 문자열이면 비움)입니다.
field.code=프로젝트+마일스톤 내 유일한 기준 코드(1..64자; 기준 생성 시 필수)입니다.
field.criterion_text=마일스톤 판정 기준 본문(1..4000자; 기준 생성 시 필수)입니다.
