# English texts that a model reads: the descriptions of the tools and of their arguments, and the catalog texts.
# A description in a tool declaration is one of these keys; the tool catalog resolves it.

catalog.empty=No active {0} codes exist yet. Add one with: ledger-cli code-set {0} CODE NAME

# ---------------------------------------------------------------- write tools
tool.ledger_save=Create (expected_version = 0 or absent) or edit (expected_version = current version) a defect, task or condition. fields is an object with the keys of the kind. Defect: project_id (new only), title, category, severity (required: a defect that still holds the retired UNRATED must be rated in the same write), behavior, root_cause, owner_actor_id. Task: project_id, title, purpose, success_condition, owner_actor_id, origin_ref, origin_quote. Condition: project_id, release, goal_label, code, condition_text. A key written with null or an empty text clears an optional field; a key left out is not touched. A new defect without id gets the next <PROJECT_CODE>-D-<n> id and a new task without id the next <PROJECT_CODE>-T-<n> id. State changes use ledger_transition. Needs scope defect (defect) or task (task, condition).
tool.ledger_transition=Change the state of a defect, task or condition (one history row). Defect: OPEN, SOURCE_FIXED (needs a recorded fix), NOT_DEFECT and DISPUTED (need evidence_uri), MERGED (needs merged_into). Task: PLANNED, ACTIVE, BLOCKED, REPORTED_DONE (needs evidence_uri), CANCELLED. VERIFIED, MET and NOT_MET, and any move out of them, go through ledger_review. Needs scope defect or task.
tool.ledger_record_fix=Record a fix commit for a defect, or update the CI result of an already recorded fix. Recording a new fix commit makes the fixing session the owner of the defect (fixed_by) while created_by stays. An OPEN defect moves to SOURCE_FIXED in the same transaction unless mark_source_fixed is false. Needs scope fix.
tool.ledger_record_case=Add one observed case (symptom, log, user report) under a defect. One defect is one root cause; its cases are listed by ledger_defect together with the cases of the defects merged into it. A MERGED defect is refused: the error names the defect it was merged into, record the case there. Needs scope defect.
tool.ledger_link=Add a link, or with remove = true remove it. defect_task: a = defect, b = task. A relation kind: a and b are defects. condition_task and condition_defect: a = condition. Needs scope defect (defect links) or task (condition links).
tool.ledger_correct=Mark a history row as wrong with a CORRECT row (history is never edited). Corrections of verification rows go through ledger_review_correct.
tool.ledger_batch=Run up to 200 write operations in one transaction: all of them commit or none does, and an error names the failing operation. ops is an array of objects {op: save | transition | record_fix | record_case | link | correct, ...} with the arguments of the single tool. Each operation may carry its own request_id; otherwise one is derived from the batch request_id and the position, so sending the same batch again with the same request_id returns the stored results. Grants, the channel rules (no verification here) and all checks are those of the single tools.
tool.ledger_review=Reviewer transition. Defect SOURCE_FIXED to VERIFIED needs evidence_uri and at least one recorded fix from another session; CI is optional metadata. The developer provides the source SHA, the original failure reproduction and the direct execution steps; the reviewer runs the actual program. Send verification results or rework requests to the session that fixed the defect (fixed_by of ledger_defect), not to created_by. Task REPORTED_DONE to VERIFIED needs evidence_uri and a session other than the owner and the completion reporter. Condition to MET or NOT_MET needs evidence_uri. Also reopens VERIFIED rows (evidence_uri required). Needs scope verify.
tool.ledger_review_correct=Mark a verification history row as wrong with a CORRECT row. Needs scope verify.
tool.ledger_whoami=Show whether an author id is well formed and which live grants (project, scope) it holds. Read only.

# ---------------------------------------------------------------- read tools
tool.ledger_get=The state and version of many ids at once (defects, tasks and conditions may be mixed): the check after a write and the way to get an expected_version. An id that is both a defect id and a task id gives both items; unknown ids are listed in not_found.
tool.ledger_defect=One defect with its fixes, tasks, conditions, cases (also those of defects merged into it), relations, last change, recent changes, fixed_by and owner.
tool.ledger_task=One task with title, purpose, success condition, origin, owner, state, version, the session that reported it done (completed_by), its defects and conditions.
tool.ledger_history=The history, the receipt of every write, ascending by id: by id list, id range, entity, project, operation, author and time range. include_before adds before_data, the full row as it was before the change, where there is one.
tool.ledger_search=Find defects, tasks and conditions by keywords (title, purpose, behavior, root cause or condition text, case-insensitive, % _ and backslash are literal), newest first. match = ANY (default) or ALL.
tool.ledger_defects=The defects of a project, newest first, optionally filtered by status, severity, category, attention kind and owner.
tool.ledger_tasks=The tasks of a project, newest first, optionally filtered by state, owner and attention kind.
tool.ledger_conditions=The release conditions of a project, optionally filtered by state and release.
tool.ledger_attention=The defects and tasks that need a look, five kinds: OPEN_WITH_FIX, FIXED_WITHOUT_COMMIT, OPEN_NO_OWNER, TASK_UNKNOWN, DONE_NOT_VERIFIED.
tool.ledger_stats=Counts per state: defects by status and severity, tasks by state, conditions by state, of one project or of all. bucket = day adds the new defects and tasks per UTC day.
tool.ledger_projects=The projects with id, code and title.
tool.ledger_codes=The common codes (defect category, defect severity, relation kind) with their texts. Retired codes are listed only with include_inactive.

# ---------------------------------------------------------------- arguments
param.host_attestation=Filled by the host hook; do not supply manually. Without it every write is refused with HOST_ATTESTATION_REQUIRED.
param.author_id=Legacy key of the old tool contract: accepted and ignored. The author is the host attestation.
param.request_id=UUID that makes a retry safe; omitted means a new id.
param.batch_request_id=UUID that makes a retry of the whole batch safe; omitted means a new id.
param.reason=Why, 10..1000 characters.
param.case_reason=Why it is recorded, 10..1000 characters.
param.correct_reason=What was wrong, 10..1000 characters.
param.entity=What to save or change: defect, task or condition.
param.review_entity=What to review: defect, task or condition.
param.id=Row id.
param.save_id=Row id; required to edit and for a new condition; omit it for a new defect or task to get the next id.
param.expected_version=Current version of the row (optimistic lock).
param.save_expected_version=0 or absent to create, otherwise the current version (optimistic lock).
param.fields=The fields to set, as an object. The valid keys depend on the entity.
param.transition_to=New state for this entity (verification uses ledger_review).
param.review_to=New state: VERIFIED, MET, NOT_MET, or the state a VERIFIED, MET or NOT_MET row goes back to.
param.evidence_uri=Link to the evidence (CI run, commit, log).
param.review_evidence_uri=Link to the run that shows the result.
param.evidence_sha256=SHA-256 (64 lowercase hex characters) of the evidence file, if any.
param.merged_into=Target defect id for MERGED.
param.defect_id=Defect id.
param.task_id=Task id.
param.repo=Repository, for example owner/name.
param.commit_sha=Full 40-character lowercase commit SHA.
param.branch=Branch of the commit.
param.ci_ref=CI run URL; required with ci_conclusion and to update an existing fix.
param.ci_conclusion=Optional CI result metadata; not a verification requirement.
param.ci_completed_at=CI completion time, ISO 8601.
param.mark_source_fixed=Move an OPEN defect to SOURCE_FIXED (default true).
param.observation=What was observed, 1..4000 characters.
param.case_evidence=Where it can be checked: request id, file:line, log location, run URL (up to 2000 characters).
param.user_quote=The words of the user, verbatim (up to 2000 characters).
param.observed_at=When it was observed, ISO 8601; omitted means not known.
param.kind=Link kind.
param.link_a=First id.
param.link_b=Second id.
param.remove=Remove the link instead of adding it.
param.history_id=History id to correct.
param.ops=Array of 1..200 operation objects.

param.ids=Ids to look up (1..200), defects, tasks and conditions mixed.
param.project=Project id.
param.max_rows=Rows per page, 1..1000 (default 50). A longer list is cut and the result carries truncated and next_cursor.
param.cursor=The next_cursor of the previous page of the same call with the same filters.
param.history_ids=History ids.
param.id_from=Lowest history id.
param.id_to=Highest history id.
param.history_entity=Kind of row the history entry is about.
param.entity_id=Id of that row.
param.op=Operation of the history entry.
param.history_author_id=Author of the history entry.
param.at_from=Earliest time (UTC, ISO 8601, inclusive).
param.at_to=Latest time (UTC, ISO 8601, inclusive).
param.include_before=Also return before_data (the full row before the change) where there is one.
param.search_kinds=Kinds to search: defect, task, condition (default all).
param.keywords=Keywords, 1..200 characters each.
param.match=ANY: one keyword is enough (default). ALL: every keyword must be found.
param.exclude_status=States to leave out.
param.created_from=Earliest creation time (UTC, ISO 8601, inclusive).
param.created_to=Latest creation time (UTC, ISO 8601, inclusive).
param.defect_status=Defect status.
param.severity=Severity code (also a retired one, such as UNRATED).
param.category=Category code.
param.attention_kind=Attention kind.
param.attention_filter=Only this kind of item.
param.owner=Owner (author id).
param.task_state=Task state.
param.condition_state=Condition state.
param.release=Release name.
param.bucket=day adds the new defects and tasks per UTC day.
param.code_group=Common-code group.
param.include_inactive=Also list retired codes.

# ---------------------------------------------------------------- fields of ledger_save
field.project_id=Project id (when creating).
field.title=Title.
field.category=Defect category.
field.severity=Defect severity.
field.behavior=Defect: what happens.
field.root_cause=Defect: the root cause.
field.owner_actor_id=Owner, an author id; clears the owner when written empty.
field.purpose=Task: purpose.
field.success_condition=Task: how to tell that it is done.
field.origin_ref=Task: where the task comes from.
field.origin_quote=Task: the words of the user it comes from.
field.release=Condition: release name.
field.goal_label=Condition: goal label.
field.code=Condition: code, unique per project and release.
field.condition_text=Condition: the condition.
